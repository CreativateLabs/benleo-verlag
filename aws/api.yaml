AWSTemplateFormatVersion: '2010-09-09'
Description: BENLEO VERLAG — API (Lambda + HTTP API Gateway). Depends on stack benleo-core.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign JWTs.
  UploadBucket:
    Type: String
    Default: benleo-uploads-871020805052
  DataTable:
    Type: String
    Default: benleo-data

Resources:

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: benleo-api-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: benleo-api-scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/benleo-*:*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:BatchWriteItem]
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTable}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DataTable}/index/*'
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub 'arn:aws:s3:::${UploadBucket}/*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/benleo/*'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
      Tags:
        - { Key: Project, Value: benleo }

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: benleo-api
      Runtime: nodejs20.x
      Handler: lambda.handler
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt ApiFunctionRole.Arn
      Code: .
      Environment:
        Variables:
          TABLE: !Ref DataTable
          UPLOAD_BUCKET: !Ref UploadBucket
          JWT_SECRET: !Ref JwtSecret
          NOTIFY_EMAIL: post@benleo-verlag.de
          SMTP_HOST: smtp.benleo-verlag.de
          SMTP_PORT: '465'
          SMTP_USER: post@benleo-verlag.de
          SMTP_PASS_PARAM: /benleo/smtp/password
      Tags:
        - { Key: Project, Value: benleo }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: benleo-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['*']
        AllowHeaders: ['*']
        MaxAge: 3600
      Tags: { Project: benleo }

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${Integration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
