<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benleo Verlag — Verwaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{
    --blue-deep:#0d1530; --blue-rich:#1a2257; --blue-mid:#273481;
    --gold:#F9D386; --gold-dk:#C9A84C; --cream:#F5EDD5; --white:#fff;
    --muted:rgba(255,255,255,.6); --line:rgba(249,211,134,.18);
    --ok:#5fd08a; --warn:#f0b95f; --err:#ef6f6f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',sans-serif;background:var(--blue-rich);color:var(--white);font-size:14px;line-height:1.5}
  [data-lucide]{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;vertical-align:middle;flex-shrink:0}
  a{color:var(--gold);text-decoration:none}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;line-height:1.15}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:var(--white);padding:.6rem .7rem;border-radius:6px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  select option{background:var(--blue-rich)}
  textarea{resize:vertical;min-height:70px}
  label{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 .35rem}
  .btn{display:inline-flex;align-items:center;gap:.5rem;border:none;border-radius:6px;padding:.6rem 1.1rem;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:.2s}
  .btn-gold{background:var(--gold);color:var(--blue-rich)}
  .btn-gold:hover{background:var(--cream)}
  .btn-ghost{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.25)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
  .btn-danger{background:transparent;color:var(--err);border:1px solid rgba(239,111,111,.4)}
  .btn-danger:hover{background:rgba(239,111,111,.12)}
  .btn-sm{padding:.4rem .7rem;font-size:.65rem}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .login-card{width:100%;max-width:380px;background:var(--blue-deep);border:1px solid var(--line);border-radius:14px;padding:2.5rem 2rem}
  .login-card h1{font-size:1.8rem;text-align:center;margin-bottom:.25rem}
  .login-card .sub{text-align:center;color:var(--muted);font-size:.78rem;margin-bottom:1.75rem}
  .login-card .field{margin-bottom:1rem}
  .login-card .btn{width:100%;justify-content:center;margin-top:.5rem}
  .hint{margin-top:1.25rem;font-size:.68rem;color:var(--muted);text-align:center;line-height:1.6}

  /* app shell */
  #app{display:none;min-height:100vh;grid-template-columns:230px 1fr}
  aside{background:var(--blue-deep);border-right:1px solid var(--line);padding:1.5rem 1rem;display:flex;flex-direction:column;gap:.25rem;position:sticky;top:0;height:100vh}
  .brand{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--gold);padding:.25rem .6rem 1.25rem;letter-spacing:.02em}
  .brand small{display:block;font-family:'Montserrat';font-size:.55rem;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-top:.15rem}
  .navlink{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:8px;color:rgba(255,255,255,.8);font-size:.82rem;font-weight:500;background:none;border:none;text-align:left;width:100%;transition:.15s}
  .navlink:hover{background:rgba(255,255,255,.05);color:var(--white)}
  .navlink.active{background:rgba(249,211,134,.14);color:var(--gold)}
  .navlink .badge{margin-left:auto;background:var(--gold);color:var(--blue-rich);font-size:.6rem;font-weight:700;padding:.05rem .4rem;border-radius:20px}
  aside .spacer{flex:1}
  .whoami{font-size:.68rem;color:var(--muted);padding:.5rem .8rem;border-top:1px solid rgba(255,255,255,.08);margin-top:.5rem}

  main{padding:2.25rem 2.5rem;max-width:1100px}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;gap:1rem;flex-wrap:wrap}
  .page-head h2{font-size:1.9rem}
  .page-head p{color:var(--muted);font-size:.8rem;margin-top:.2rem}

  .card{background:var(--blue-deep);border:1px solid var(--line);border-radius:12px;padding:1.25rem 1.4rem;margin-bottom:1rem}
  .row{display:flex;gap:1rem;align-items:flex-start}
  .row>*{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .list-item{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;background:var(--blue-deep);border:1px solid var(--line);border-radius:10px;margin-bottom:.6rem}
  .list-item .li-main{flex:1;min-width:0}
  .li-title{font-weight:600;font-size:.95rem}
  .li-meta{font-size:.72rem;color:var(--muted);margin-top:.15rem}
  .li-actions{display:flex;gap:.4rem;flex-shrink:0}
  .pill{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.15rem .5rem;border-radius:20px}
  .pill-pub{background:rgba(95,208,138,.15);color:var(--ok)}
  .pill-soon{background:rgba(240,185,95,.15);color:var(--warn)}
  .pill-new{background:var(--gold);color:var(--blue-rich)}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);font-size:.85rem;padding:2rem;text-align:center;border:1px dashed var(--line);border-radius:10px}

  /* modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(5,9,25,.75);backdrop-filter:blur(4px);z-index:100;align-items:flex-start;justify-content:center;padding:3rem 1.5rem;overflow-y:auto}
  .modal-bg.open{display:flex}
  .modal{width:100%;max-width:640px;background:var(--blue-rich);border:1px solid var(--line);border-radius:14px;padding:1.75rem}
  .modal h3{font-size:1.5rem;margin-bottom:1.25rem}
  .modal .field{margin-bottom:1rem}
  .modal-foot{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.5rem}

  /* toast */
  #toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:200;display:flex;flex-direction:column;gap:.5rem}
  .toast{background:var(--blue-deep);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:.75rem 1.1rem;font-size:.8rem;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:slideIn .25s}
  .toast.err{border-left-color:var(--err)}
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media(max-width:760px){
    #app{grid-template-columns:1fr}
    aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:.35rem}
    aside .spacer,.brand small{display:none}
    .brand{padding:.25rem .6rem;width:100%}
    main{padding:1.5rem 1.25rem}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <h1>Benleo Verlag</h1>
    <p class="sub">Verwaltung / Admin</p>
    <form id="loginForm">
      <div class="field"><label>E-Mail</label><input type="email" id="loginEmail" required autocomplete="username"></div>
      <div class="field"><label>Passwort</label><input type="password" id="loginPass" required autocomplete="current-password"></div>
      <button class="btn btn-gold" type="submit"><i data-lucide="log-in"></i> Anmelden</button>
    </form>
    <p class="hint" id="loginHint">Demo-Zugang: admin@benleo-verlag.de / benleo-admin</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <aside>
    <div class="brand">Benleo<small>Verwaltung</small></div>
    <button class="navlink active" data-view="dashboard"><i data-lucide="layout-dashboard"></i> Übersicht</button>
    <button class="navlink" data-view="products"><i data-lucide="book-open"></i> Produkte</button>
    <button class="navlink" data-view="events"><i data-lucide="calendar-days"></i> Veranstaltungen</button>
    <button class="navlink" data-view="content"><i data-lucide="type"></i> Inhalte</button>
    <button class="navlink" data-view="plugins"><i data-lucide="puzzle"></i> Plugins</button>
    <button class="navlink" data-view="submissions"><i data-lucide="inbox"></i> Einreichungen <span class="badge" id="subCount" style="display:none">0</span></button>
    <div class="spacer"></div>
    <div class="whoami" id="whoami"></div>
    <button class="navlink" id="logoutBtn"><i data-lucide="log-out"></i> Abmelden</button>
  </aside>
  <main id="main"></main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ================= API layer ================= */
const API = location.origin + '/api';
let token = localStorage.getItem('benleo_admin_token') || '';
let me = null;
let cache = { products: [], events: [], content: {}, submissions: [] };

async function api(pathname, { method = 'GET', body, form } = {}) {
  const opts = { method, headers: {} };
  if (token) opts.headers.Authorization = 'Bearer ' + token;
  if (form) { opts.body = form; }
  else if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + pathname, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Fehler ' + res.status));
  return data;
}

function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ================= Auth ================= */
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const r = await api('/auth/login', { method: 'POST', body: {
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPass').value,
    }});
    if (r.user.role !== 'admin') { document.getElementById('loginHint').textContent = 'Dieser Account hat keine Admin-Rechte.'; return; }
    token = r.token; me = r.user;
    localStorage.setItem('benleo_admin_token', token);
    enterApp();
  } catch (err) {
    const h = document.getElementById('loginHint'); h.textContent = err.message; h.style.color = 'var(--err)';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  token = ''; me = null; localStorage.removeItem('benleo_admin_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
});

async function enterApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  document.getElementById('whoami').textContent = me ? (me.name || me.email) : '';
  await refreshAll();
  show('dashboard');
  lucide.createIcons();
}

async function refreshAll() {
  const [products, events, content, submissions] = await Promise.all([
    api('/products'), api('/events'), api('/content'), api('/submissions').catch(() => []),
  ]);
  cache = { products, events, content, submissions };
  const neu = submissions.filter(s => s.status === 'neu').length;
  const b = document.getElementById('subCount');
  b.textContent = neu; b.style.display = neu ? 'inline-block' : 'none';
}

/* ================= Router ================= */
document.querySelectorAll('.navlink[data-view]').forEach(btn =>
  btn.addEventListener('click', () => show(btn.dataset.view)));

function show(view) {
  document.querySelectorAll('.navlink[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  ({ dashboard: viewDashboard, products: viewProducts, events: viewEvents, content: viewContent, plugins: viewPlugins, submissions: viewSubmissions }[view] || viewDashboard)();
  lucide.createIcons();
}

/* ================= Views ================= */
function statusPill(s){ return s==='coming_soon'?'<span class="pill pill-soon">Coming soon</span>':'<span class="pill pill-pub">Veröffentlicht</span>'; }

function viewDashboard() {
  const c = cache;
  const neu = c.submissions.filter(s => s.status === 'neu').length;
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Übersicht</h2><p>Willkommen zurück. Hier verwaltest du die gesamte Website.</p></div></div>
    <div class="grid2">
      ${statCard('book-open','Produkte', c.products.length,'products')}
      ${statCard('calendar-days','Veranstaltungen', c.events.length,'events')}
      ${statCard('type','Text-Blöcke', Object.keys(c.content).length,'content')}
      ${statCard('inbox','Einreichungen', c.submissions.length + (neu?` · ${neu} neu`:''),'submissions')}
    </div>
    <div class="card" style="margin-top:1rem">
      <h3 style="font-size:1.2rem;margin-bottom:.5rem">Was du hier tun kannst</h3>
      <p class="muted" style="font-size:.82rem;line-height:1.7">
        Produkte anlegen und bearbeiten (inkl. „Coming soon"/geblurrt), Veranstaltungen &amp; Werkstätten pflegen,
        alle Texte zweisprachig (DE/EN) ändern und eingehende Einreichungen inkl. hochgeladener Dateien einsehen.
      </p>
    </div>`;
  document.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => show(el.dataset.goto)));
}
function statCard(icon,label,val,goto){
  return `<div class="card" style="cursor:pointer" data-goto="${goto}">
    <div style="display:flex;align-items:center;gap:.7rem;color:var(--gold)"><i data-lucide="${icon}"></i>
      <span style="font-size:.7rem;letter-spacing:.12em;text-transform:uppercase">${label}</span></div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:2.4rem;color:var(--white);margin-top:.4rem">${val}</div>
  </div>`;
}

/* ---- Products ---- */
function viewProducts() {
  const items = cache.products;
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Produkte</h2><p>Bücher, Hörbücher und weitere Titel.</p></div>
      <button class="btn btn-gold" id="addProduct"><i data-lucide="plus"></i> Neues Produkt</button></div>
    <div id="productList">${items.length ? items.map(productRow).join('') : '<div class="empty">Noch keine Produkte.</div>'}</div>`;
  document.getElementById('addProduct').addEventListener('click', () => productModal());
  bindRowActions('product', cache.products, productModal, async id => { await api('/products/'+id,{method:'DELETE'}); toast('Produkt gelöscht'); });
}
function productRow(p){
  const thumb = p.coverKey
    ? `<img src="${location.origin}/api/media/${esc(p.coverKey)}" alt="" style="width:38px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex-shrink:0">`
    : `<div style="width:38px;height:52px;border-radius:4px;border:1px dashed var(--line);flex-shrink:0"></div>`;
  return `<div class="list-item">
    ${thumb}
    <div class="li-main"><div class="li-title">${esc(p.title?.de||'—')} ${p.blurName?'<span class="pill pill-soon">blur</span>':''}</div>
      <div class="li-meta">${esc(p.type)} · ${esc(p.author||'—')} · ${statusPill(p.status)}</div></div>
    <div class="li-actions">
      <button class="btn btn-ghost btn-sm" data-edit="product" data-id="${p.id}"><i data-lucide="pencil"></i></button>
      <button class="btn btn-danger btn-sm" data-del="product" data-id="${p.id}"><i data-lucide="trash-2"></i></button></div>
  </div>`;
}
function productModal(p){
  const isNew = !p; p = p || { title:{de:'',en:''}, description:{de:'',en:''}, type:'roman', status:'published', author:'', amazonUrl:'', blurName:false, coverKey:null };
  let coverKey = p.coverKey || null;
  const coverSrc = coverKey ? (location.origin + '/api/media/' + coverKey) : '';
  openModal(`${isNew?'Neues Produkt':'Produkt bearbeiten'}`, `
    <div class="field"><label>Cover-Bild</label>
      <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
        <img id="p_cover_prev" src="${esc(coverSrc)}" alt="" style="width:80px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--line);${coverKey?'':'display:none'}">
        <div id="p_cover_ph" style="width:80px;height:110px;border-radius:6px;border:1px dashed var(--line);display:${coverKey?'none':'flex'};align-items:center;justify-content:center;color:var(--muted);font-size:.7rem">kein Bild</div>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer"><i data-lucide="upload"></i> Bild hochladen<input type="file" id="p_cover_input" accept="image/*" style="display:none"></label>
        <span id="p_cover_name" class="muted" style="font-size:.72rem"></span>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>Titel (DE)</label><input id="p_tde" value="${esc(p.title?.de)}"></div>
      <div class="field"><label>Titel (EN)</label><input id="p_ten" value="${esc(p.title?.en)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Typ</label><select id="p_type">
        ${['roman','hoerbuch','musik','kunst','sonstiges'].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}
      </select></div>
      <div class="field"><label>Status</label><select id="p_status">
        <option value="published" ${p.status==='published'?'selected':''}>Veröffentlicht</option>
        <option value="coming_soon" ${p.status==='coming_soon'?'selected':''}>Coming soon</option>
      </select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Autor:in</label><input id="p_author" value="${esc(p.author)}"></div>
      <div class="field"><label>Amazon-Link</label><input id="p_amazon" value="${esc(p.amazonUrl)}" placeholder="https://..."></div>
    </div>
    <div class="field"><label>Beschreibung (DE)</label><textarea id="p_dde">${esc(p.description?.de)}</textarea></div>
    <div class="field"><label>Beschreibung (EN)</label><textarea id="p_den">${esc(p.description?.en)}</textarea></div>
    <div class="field"><label style="display:flex;align-items:center;gap:.5rem;text-transform:none;letter-spacing:0;font-size:.82rem;color:var(--white)">
      <input type="checkbox" id="p_blur" ${p.blurName?'checked':''} style="width:auto"> Titel geblurrt anzeigen (Name noch geheim)</label></div>
  `, async () => {
    const payload = {
      title:{de:val('p_tde'),en:val('p_ten')}, description:{de:val('p_dde'),en:val('p_den')},
      type:val('p_type'), status:val('p_status'), author:val('p_author'), amazonUrl:val('p_amazon'),
      blurName:document.getElementById('p_blur').checked, coverKey: coverKey,
    };
    if (isNew) await api('/products',{method:'POST',body:payload});
    else await api('/products/'+p.id,{method:'PUT',body:payload});
    toast('Produkt gespeichert');
  });
  // wire cover upload (presign -> PUT -> set coverKey)
  const cinp = document.getElementById('p_cover_input');
  if (cinp) cinp.addEventListener('change', async () => {
    const f = cinp.files[0]; if (!f) return;
    const ct = f.type || 'application/octet-stream';
    try {
      const pre = await api('/uploads/presign', { method:'POST', body:{ filename:f.name, contentType:ct, kind:'content' } });
      await new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('PUT',pre.url); x.setRequestHeader('Content-Type',ct); x.onload=()=>x.status>=200&&x.status<300?res():rej(new Error('Upload '+x.status)); x.onerror=()=>rej(new Error('Netzwerkfehler')); x.send(f); });
      coverKey = pre.key;
      const prev=document.getElementById('p_cover_prev'), ph=document.getElementById('p_cover_ph');
      prev.src = location.origin + '/api/media/' + coverKey + '?t=' + Date.now(); prev.style.display=''; if(ph) ph.style.display='none';
      document.getElementById('p_cover_name').textContent = 'Neues Bild bereit — mit „Speichern" übernehmen';
      toast('Bild hochgeladen');
    } catch(e){ toast(e.message, true); }
  });
}

/* ---- Events ---- */
function viewEvents(){
  const items = cache.events;
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Veranstaltungen</h2><p>Werkstätten, Lesungen &amp; Kulturveranstaltungen.</p></div>
      <button class="btn btn-gold" id="addEvent"><i data-lucide="plus"></i> Neue Veranstaltung</button></div>
    <div>${items.length ? items.map(eventRow).join('') : '<div class="empty">Noch keine Veranstaltungen.</div>'}</div>`;
  document.getElementById('addEvent').addEventListener('click', () => eventModal());
  bindRowActions('event', cache.events, eventModal, async id => { await api('/events/'+id,{method:'DELETE'}); toast('Veranstaltung gelöscht'); });
}
function eventRow(e){
  return `<div class="list-item">
    <div class="li-main"><div class="li-title">${esc(e.title?.de||'—')}</div>
      <div class="li-meta">${esc(e.kind)} · ${esc(e.location||'—')} · ${statusPill(e.status)}</div></div>
    <div class="li-actions">
      <button class="btn btn-ghost btn-sm" data-edit="event" data-id="${e.id}"><i data-lucide="pencil"></i></button>
      <button class="btn btn-danger btn-sm" data-del="event" data-id="${e.id}"><i data-lucide="trash-2"></i></button></div>
  </div>`;
}
function eventModal(e){
  const isNew=!e; e=e||{title:{de:'',en:''},description:{de:'',en:''},kind:'veranstaltung',location:'',status:'published',date:''};
  openModal(`${isNew?'Neue Veranstaltung':'Veranstaltung bearbeiten'}`,`
    <div class="grid2">
      <div class="field"><label>Titel (DE)</label><input id="e_tde" value="${esc(e.title?.de)}"></div>
      <div class="field"><label>Titel (EN)</label><input id="e_ten" value="${esc(e.title?.en)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Art</label><select id="e_kind">
        ${['veranstaltung','werkstatt','lesung'].map(k=>`<option ${e.kind===k?'selected':''}>${k}</option>`).join('')}</select></div>
      <div class="field"><label>Status</label><select id="e_status">
        <option value="published" ${e.status==='published'?'selected':''}>Veröffentlicht</option>
        <option value="coming_soon" ${e.status==='coming_soon'?'selected':''}>Coming soon</option></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Ort</label><input id="e_loc" value="${esc(e.location)}" placeholder="z. B. Bunker"></div>
      <div class="field"><label>Datum</label><input id="e_date" value="${esc(e.date)}" placeholder="z. B. 12.09.2027"></div>
    </div>
    <div class="field"><label>Beschreibung (DE)</label><textarea id="e_dde">${esc(e.description?.de)}</textarea></div>
    <div class="field"><label>Beschreibung (EN)</label><textarea id="e_den">${esc(e.description?.en)}</textarea></div>
  `, async () => {
    const payload={title:{de:val('e_tde'),en:val('e_ten')},description:{de:val('e_dde'),en:val('e_den')},
      kind:val('e_kind'),status:val('e_status'),location:val('e_loc'),date:val('e_date')};
    if(isNew) await api('/events',{method:'POST',body:payload}); else await api('/events/'+e.id,{method:'PUT',body:payload});
    toast('Veranstaltung gespeichert');
  });
}

/* ---- Inhalte (universal CMS over all pages) ---- */
const CMS_PAGES = ['index.html','ueber-uns.html','programm.html','veranstaltungen.html','teil-werden.html','profil.html','team.html','presse.html','impressum.html','datenschutz.html','agb.html'];
const PAGE_TITLES = { global:'Allgemein (Footer & global)', index:'Startseite', about:'Über uns', programm:'Programm & Projekte', events:'Kulturveranstaltungen', join:'Teil werden', account:'Mein Konto', press:'Presse', impressum:'Impressum', datenschutz:'Datenschutz', agb:'AGB' };
let cmsFields = [];

// Load every page in a hidden iframe so its own site.js registers all fields
// with exactly the keys the public site uses.
async function scanPages(){
  const ifr = document.createElement('iframe');
  ifr.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1024px;height:10px;opacity:0;border:0';
  document.body.appendChild(ifr);
  for (const p of CMS_PAGES){
    await new Promise(res => { let done=false; const go=()=>{if(done)return;done=true;setTimeout(res,450);}; ifr.onload=go; setTimeout(go,4000); ifr.src = location.origin + '/' + p; });
  }
  ifr.remove();
}
async function viewContent(){
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Inhalte</h2><p>Alle Texte, Titel und Bilder aller Seiten — zweisprachig (DE/EN).</p></div>
      <button class="btn btn-ghost btn-sm" id="cmsRescan"><i data-lucide="refresh-cw"></i> Seiten neu einlesen</button></div>
    <div id="cmsBody"><div class="empty">Seiten werden eingelesen…</div></div>`;
  document.getElementById('cmsRescan').addEventListener('click', viewContent);
  lucide.createIcons();
  try { await scanPages(); } catch(e){}
  try { cmsFields = await api('/admin/content-fields'); } catch(e){ cmsFields = []; }
  renderCmsFields();
}
function renderCmsFields(){
  const host = document.getElementById('cmsBody');
  if (!cmsFields.length){ host.innerHTML = '<div class="empty">Keine Felder gefunden.</div>'; return; }
  const byPage = {};
  cmsFields.forEach((f,i) => { (byPage[f.page] = byPage[f.page] || []).push(i); });
  const order = Object.keys(PAGE_TITLES).filter(p=>byPage[p]).concat(Object.keys(byPage).filter(p=>!PAGE_TITLES[p]));
  host.innerHTML = order.map(pg => `
    <div style="margin:1.5rem 0 .5rem"><h3 class="serif" style="font-size:1.4rem;color:var(--gold)">${esc(PAGE_TITLES[pg]||pg)}</h3></div>
    ${byPage[pg].map(cmsFieldCard).join('')}`).join('');
  cmsFields.forEach((f,i) => {
    if (f.type === 'image'){
      const inp = document.getElementById('cfimg_'+i);
      if (inp) inp.addEventListener('change', () => uploadCmsImage(i, inp));
    } else {
      const btn = document.querySelector(`[data-cf-save="${i}"]`);
      if (btn) btn.addEventListener('click', () => saveCmsText(i));
      const rst = document.querySelector(`[data-cf-reset="${i}"]`);
      if (rst) rst.addEventListener('click', () => resetCmsField(i));
    }
  });
  lucide.createIcons();
}
function cmsFieldCard(i){
  const f = cmsFields[i];
  const overridden = !!f.value;
  if (f.type === 'image'){
    const src = (f.value && f.value.img) ? f.value.img : (f.default && f.default.de) || '';
    const srcAbs = /^(https?:|\/)/.test(src) ? src : location.origin + '/' + src;
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
        <div style="font-weight:600;font-size:.85rem">${esc(f.label)} ${overridden?'<span class="pill pill-new">geändert</span>':''}</div></div>
      <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
        <img src="${esc(srcAbs)}" alt="" style="width:120px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer"><i data-lucide="upload"></i> Bild ersetzen<input type="file" id="cfimg_${i}" accept="image/*" style="display:none"></label>
      </div></div>`;
  }
  const de = (f.value && f.value.de) ? f.value.de : (f.default&&f.default.de)||'';
  const en = (f.value && f.value.en) ? f.value.en : (f.default&&f.default.en)||'';
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
      <div style="font-weight:600;font-size:.85rem">${esc(f.label)} ${overridden?'<span class="pill pill-new">geändert</span>':'<span class="pill" style="background:rgba(255,255,255,.08);color:var(--muted)">Standard</span>'}</div>
      <div style="display:flex;gap:.4rem">
        ${overridden?`<button class="btn btn-ghost btn-sm" data-cf-reset="${i}">Zurücksetzen</button>`:''}
        <button class="btn btn-gold btn-sm" data-cf-save="${i}"><i data-lucide="save"></i> Speichern</button></div></div>
    <div class="grid2">
      <div class="field"><label>Deutsch</label><textarea id="cfde_${i}">${esc(de)}</textarea></div>
      <div class="field"><label>English</label><textarea id="cfen_${i}">${esc(en)}</textarea></div>
    </div></div>`;
}
async function saveCmsText(i){
  const f = cmsFields[i];
  try {
    const body = { de: val('cfde_'+i), en: val('cfen_'+i) };
    const r = await api('/content/'+encodeURIComponent(f.key), { method:'PUT', body });
    f.value = r.value; toast('Gespeichert'); renderCmsFields();
  } catch(e){ toast(e.message, true); }
}
async function resetCmsField(i){
  const f = cmsFields[i];
  try { await api('/content/'+encodeURIComponent(f.key), { method:'PUT', body:{ de:'', en:'' } }); f.value = null; toast('Auf Standard zurückgesetzt'); renderCmsFields(); }
  catch(e){ toast(e.message, true); }
}
async function uploadCmsImage(i, inp){
  const f = cmsFields[i]; const file = inp.files[0]; if (!file) return;
  try {
    const ct = file.type || 'application/octet-stream';
    const pre = await api('/uploads/presign', { method:'POST', body:{ filename:file.name, contentType:ct, kind:'content' } });
    await new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('PUT',pre.url); x.setRequestHeader('Content-Type',ct); x.onload=()=>x.status>=200&&x.status<300?res():rej(new Error('Upload '+x.status)); x.onerror=()=>rej(new Error('Netzwerkfehler')); x.send(file); });
    const data = await api('/content/'+encodeURIComponent(f.key)+'/image', { method:'POST', body:{ fileKey: pre.key } });
    f.value = data.value; toast('Bild ersetzt'); renderCmsFields();
  } catch(e){ toast(e.message, true); }
}

/* ---- Submissions ---- */
function viewSubmissions(){
  const items = cache.submissions;
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Einreichungen</h2><p>Eingegangene Projekte, Manuskripte, Musik &amp; Kunst.</p></div></div>
    <div>${items.length ? items.map(subRow).join('') : '<div class="empty">Noch keine Einreichungen.</div>'}</div>`;
  items.forEach(s => {
    const el = document.querySelector(`[data-sub="${s.id}"]`);
    el.querySelector('[data-view-sub]').addEventListener('click', () => subModal(s));
  });
}
function subRow(s){
  const isNew = s.status === 'neu';
  return `<div class="list-item" data-sub="${s.id}">
    <div class="li-main"><div class="li-title">${esc(s.name)} ${isNew?'<span class="pill pill-new">Neu</span>':''}</div>
      <div class="li-meta">${esc(s.category)} · ${esc(s.subject||'—')} · ${s.fileName?('<i data-lucide=\'paperclip\'></i> '+esc(s.fileName)):'keine Datei'} · ${new Date(s.createdAt).toLocaleString('de-DE')}</div></div>
    <div class="li-actions"><button class="btn btn-ghost btn-sm" data-view-sub><i data-lucide="eye"></i> Ansehen</button></div>
  </div>`;
}
function subModal(s){
  const fileLink = s.fileKey
    ? `<a class="btn btn-ghost btn-sm" href="${API}/files/${s.fileKey}?t=${encodeURIComponent(token)}" target="_blank"><i data-lucide="download"></i> ${esc(s.fileName)} (${Math.round((s.fileSize||0)/1024)} KB)</a>`
    : '<span class="muted">Keine Datei angehängt</span>';
  openModal('Einreichung', `
    <div class="grid2">
      <div class="field"><label>Name</label><div>${esc(s.name)}</div></div>
      <div class="field"><label>E-Mail</label><div><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></div></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Kategorie</label><div>${esc(s.category)}</div></div>
      <div class="field"><label>Betreff</label><div>${esc(s.subject||'—')}</div></div>
    </div>
    <div class="field"><label>Nachricht</label><div style="white-space:pre-wrap;background:rgba(255,255,255,.04);padding:.7rem;border-radius:6px">${esc(s.message||'—')}</div></div>
    <div class="field"><label>Datei</label><div>${fileLink}</div></div>
    <div class="field"><label>Status</label><select id="s_status">
      ${['neu','in_pruefung','beantwortet','archiviert'].map(x=>`<option ${s.status===x?'selected':''} value="${x}">${x}</option>`).join('')}
    </select></div>
  `, async () => {
    await api('/submissions/'+s.id,{method:'PUT',body:{status:val('s_status')}});
    toast('Status aktualisiert');
  }, 'Status speichern');
  // download link needs auth via header; since <a> can't send headers, provide fetch fallback
  setTimeout(() => {
    const a = document.querySelector('#modal a[href*="/files/"]');
    if (a) a.addEventListener('click', async ev => {
      ev.preventDefault();
      try {
        const res = await fetch(`${API}/files/${s.fileKey}`, { headers:{ Authorization:'Bearer '+token }});
        if(!res.ok) throw new Error('Download fehlgeschlagen');
        const blob = await res.blob(); const url = URL.createObjectURL(blob);
        const dl = document.createElement('a'); dl.href=url; dl.download=s.fileName||'datei'; dl.click();
        URL.revokeObjectURL(url);
      } catch(e){ toast(e.message,true); }
    });
  }, 0);
}

/* ---- Plugins ---- */
async function viewPlugins(){
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Plugins</h2><p>Funktionen an- und ausschalten — wie ein App-Store für deine Website.</p></div></div>
    <div id="pluginList" class="muted">Lädt…</div>`;
  let list = [];
  try { list = await api('/admin/plugins'); } catch(e){ toast(e.message,true); }
  const host = document.getElementById('pluginList');
  host.classList.remove('muted');
  host.innerHTML = list.map(pluginCard).join('') || '<div class="empty">Keine Plugins.</div>';
  list.forEach(pl => {
    document.querySelector(`[data-plugin-save="${pl.id}"]`).addEventListener('click', () => savePlugin(pl));
    const tgl = document.querySelector(`[data-plugin-toggle="${pl.id}"]`);
    tgl.addEventListener('change', () => savePlugin(pl, tgl.checked));
    if (pl.id === 'newsletter') loadSubscribers();
  });
  lucide.createIcons();
}
function pluginField(pid, f, settings){
  const v = settings[f.key];
  const id = `pl_${pid}_${f.key}`;
  if (f.type === 'i18n') return `<div class="grid2">
    <div class="field"><label>${esc(f.label)} (DE)</label><input id="${id}_de" value="${esc((v||{}).de||'')}"></div>
    <div class="field"><label>${esc(f.label)} (EN)</label><input id="${id}_en" value="${esc((v||{}).en||'')}"></div></div>`;
  if (f.type === 'select') return `<div class="field"><label>${esc(f.label)}</label><select id="${id}">${f.options.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if (f.type === 'textarea') return `<div class="field"><label>${esc(f.label)}</label><textarea id="${id}">${esc(v||'')}</textarea></div>`;
  return `<div class="field"><label>${esc(f.label)}</label><input id="${id}" value="${esc(v||'')}"></div>`;
}
function pluginCard(pl){
  return `<div class="card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem">
      <div style="display:flex;gap:.9rem;align-items:flex-start">
        <div style="color:var(--gold);margin-top:.15rem"><i data-lucide="${esc(pl.icon)}"></i></div>
        <div><div style="font-weight:600;font-size:1rem">${esc(pl.name)}</div>
          <div class="muted" style="font-size:.8rem;margin-top:.15rem">${esc(pl.description)}</div></div>
      </div>
      <label style="display:flex;align-items:center;gap:.5rem;flex-shrink:0;text-transform:none;letter-spacing:0;color:var(--white);font-size:.78rem">
        <input type="checkbox" data-plugin-toggle="${pl.id}" ${pl.enabled?'checked':''} style="width:auto"> ${pl.enabled?'An':'Aus'}</label>
    </div>
    <div style="border-top:1px solid var(--line);padding-top:1rem">
      ${pl.fields.map(f=>pluginField(pl.id,f,pl.settings)).join('')}
      <button class="btn btn-gold btn-sm" data-plugin-save="${pl.id}"><i data-lucide="save"></i> Speichern</button>
    </div>
    ${pl.id==='newsletter'?`<div id="subsBox" style="border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem"><div class="muted" style="font-size:.8rem">Abonnenten lädt…</div></div>`:''}
  </div>`;
}
function readPluginSettings(pl){
  const s = {};
  pl.fields.forEach(f => {
    const id = `pl_${pl.id}_${f.key}`;
    if (f.type === 'i18n') s[f.key] = { de: val(id+'_de'), en: val(id+'_en') };
    else s[f.key] = val(id);
  });
  return s;
}
async function savePlugin(pl, enabledOverride){
  try {
    const body = { settings: readPluginSettings(pl) };
    const tgl = document.querySelector(`[data-plugin-toggle="${pl.id}"]`);
    body.enabled = (typeof enabledOverride === 'boolean') ? enabledOverride : (tgl ? tgl.checked : pl.enabled);
    await api('/plugins/'+pl.id, { method:'PUT', body });
    toast(`Plugin „${pl.name}" gespeichert`);
    viewPlugins();
  } catch(e){ toast(e.message, true); }
}
async function loadSubscribers(){
  const box = document.getElementById('subsBox'); if(!box) return;
  let subs = [];
  try { subs = await api('/plugins/newsletter/subscribers'); } catch(e){ box.innerHTML = '<span class="muted">—</span>'; return; }
  const conf = subs.filter(s=>s.status==='confirmed').length;
  box.innerHTML = `<div class="label" style="color:var(--gold);margin-bottom:.6rem">Abonnenten (${conf} bestätigt / ${subs.length} gesamt)</div>` +
    (subs.length ? subs.map(s=>{const ok=s.status==='confirmed';return `<div style="font-size:.82rem;padding:.25rem 0;display:flex;align-items:center;gap:.5rem"><span class="pill ${ok?'pill-pub':'pill-soon'}" style="font-size:.55rem">${ok?'bestätigt':'ausstehend'}</span> ${esc(s.email)} <span class="muted" style="font-size:.7rem">· ${new Date(s.createdAt).toLocaleDateString('de-DE')}</span></div>`;}).join('') : '<span class="muted" style="font-size:.8rem">Noch keine Anmeldungen.</span>');
}

/* ================= helpers: modal + rows ================= */
function val(id){ const e=document.getElementById(id); return e?e.value:''; }
function openModal(title, html, onSave, saveLabel){
  const m = document.getElementById('modal');
  m.innerHTML = `<h3>${esc(title)}</h3>${html}
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">Abbrechen</button>
      ${onSave?`<button class="btn btn-gold" id="modalSave"><i data-lucide="save"></i> ${esc(saveLabel||'Speichern')}</button>`:''}
    </div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  if (onSave) document.getElementById('modalSave').addEventListener('click', async () => {
    try { await onSave(); closeModal(); await refreshAll(); rerender(); }
    catch(e){ toast(e.message, true); }
  });
  lucide.createIcons();
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id==='modalBg') closeModal(); });

let currentView='dashboard';
const _show = show;
show = v => { currentView=v; _show(v); };
function rerender(){ _show(currentView); }

function bindRowActions(kind, list, editFn, delFn){
  document.querySelectorAll(`[data-edit="${kind}"]`).forEach(b =>
    b.addEventListener('click', () => editFn(list.find(x => x.id===b.dataset.id))));
  document.querySelectorAll(`[data-del="${kind}"]`).forEach(b =>
    b.addEventListener('click', async () => {
      if(!confirm('Wirklich löschen?')) return;
      try { await delFn(b.dataset.id); await refreshAll(); rerender(); } catch(e){ toast(e.message,true); }
    }));
}

/* ================= boot ================= */
(async function boot(){
  lucide.createIcons();
  if (token) {
    try { const r = await api('/auth/me'); if (r.user.role==='admin'){ me=r.user; return enterApp(); } } catch(e){}
    token=''; localStorage.removeItem('benleo_admin_token');
  }
})();
</script>
