<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benleo Verlag — Verwaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root{
    --blue-deep:#0d1530; --blue-rich:#1a2257; --blue-mid:#273481;
    --gold:#F9D386; --gold-dk:#C9A84C; --cream:#F5EDD5; --white:#fff;
    --muted:rgba(255,255,255,.6); --line:rgba(249,211,134,.18);
    --ok:#5fd08a; --warn:#f0b95f; --err:#ef6f6f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',sans-serif;background:var(--blue-rich);color:var(--white);font-size:14px;line-height:1.5}
  [data-lucide]{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;vertical-align:middle;flex-shrink:0}
  a{color:var(--gold);text-decoration:none}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;line-height:1.15}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:var(--white);padding:.6rem .7rem;border-radius:6px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}
  select option{background:var(--blue-rich)}
  textarea{resize:vertical;min-height:70px}
  label{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 .35rem}
  .btn{display:inline-flex;align-items:center;gap:.5rem;border:none;border-radius:6px;padding:.6rem 1.1rem;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:.2s}
  .btn-gold{background:var(--gold);color:var(--blue-rich)}
  .btn-gold:hover{background:var(--cream)}
  .btn-ghost{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.25)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
  .btn-danger{background:transparent;color:var(--err);border:1px solid rgba(239,111,111,.4)}
  .btn-danger:hover{background:rgba(239,111,111,.12)}
  .btn-sm{padding:.4rem .7rem;font-size:.65rem}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .login-card{width:100%;max-width:380px;background:var(--blue-deep);border:1px solid var(--line);border-radius:14px;padding:2.5rem 2rem}
  .login-card h1{font-size:1.8rem;text-align:center;margin-bottom:.25rem}
  .login-card .sub{text-align:center;color:var(--muted);font-size:.78rem;margin-bottom:1.75rem}
  .login-card .field{margin-bottom:1rem}
  .login-card .btn{width:100%;justify-content:center;margin-top:.5rem}
  .hint{margin-top:1.25rem;font-size:.68rem;color:var(--muted);text-align:center;line-height:1.6}

  /* app shell */
  #app{display:none;min-height:100vh;grid-template-columns:230px 1fr}
  aside{background:var(--blue-deep);border-right:1px solid var(--line);padding:1.5rem 1rem;display:flex;flex-direction:column;gap:.25rem;position:sticky;top:0;height:100vh}
  .brand{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--gold);padding:.25rem .6rem 1.25rem;letter-spacing:.02em}
  .brand small{display:block;font-family:'Montserrat';font-size:.55rem;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-top:.15rem}
  .navlink{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:8px;color:rgba(255,255,255,.8);font-size:.82rem;font-weight:500;background:none;border:none;text-align:left;width:100%;transition:.15s}
  .navlink:hover{background:rgba(255,255,255,.05);color:var(--white)}
  .navlink.active{background:rgba(249,211,134,.14);color:var(--gold)}
  .nav-group{font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.32);padding:1.15rem .8rem .35rem;font-weight:700}
  details.p-sec{border:1px solid var(--line);border-radius:8px;margin-top:.7rem;padding:0 .9rem;background:rgba(255,255,255,.02)}
  details.p-sec>summary{cursor:pointer;padding:.75rem 0;color:var(--gold);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;list-style:none;display:flex;align-items:center;gap:.5rem}
  details.p-sec>summary::-webkit-details-marker{display:none}
  details.p-sec>summary::before{content:'▸';display:inline-block;transition:transform .2s}
  details.p-sec[open]>summary::before{transform:rotate(90deg)}
  details.p-sec[open]{padding-bottom:.9rem}
  .navlink .badge{margin-left:auto;background:var(--gold);color:var(--blue-rich);font-size:.6rem;font-weight:700;padding:.05rem .4rem;border-radius:20px}
  aside .spacer{flex:1}
  .whoami{font-size:.68rem;color:var(--muted);padding:.5rem .8rem;border-top:1px solid rgba(255,255,255,.08);margin-top:.5rem}

  main{padding:2.25rem 2.5rem;max-width:1100px}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;gap:1rem;flex-wrap:wrap}
  .page-head h2{font-size:1.9rem}
  .page-head p{color:var(--muted);font-size:.8rem;margin-top:.2rem}

  .card{background:var(--blue-deep);border:1px solid var(--line);border-radius:12px;padding:1.25rem 1.4rem;margin-bottom:1rem}
  .row{display:flex;gap:1rem;align-items:flex-start}
  .row>*{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .list-item{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;background:var(--blue-deep);border:1px solid var(--line);border-radius:10px;margin-bottom:.6rem}
  .list-item .li-main{flex:1;min-width:0}
  .li-title{font-weight:600;font-size:.95rem}
  .li-meta{font-size:.72rem;color:var(--muted);margin-top:.15rem}
  .li-actions{display:flex;gap:.4rem;flex-shrink:0}
  .pill{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.15rem .5rem;border-radius:20px}
  .pill-pub{background:rgba(95,208,138,.15);color:var(--ok)}
  .pill-soon{background:rgba(240,185,95,.15);color:var(--warn)}
  .pill-new{background:var(--gold);color:var(--blue-rich)}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);font-size:.85rem;padding:2rem;text-align:center;border:1px dashed var(--line);border-radius:10px}

  /* modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(5,9,25,.75);backdrop-filter:blur(4px);z-index:100;align-items:flex-start;justify-content:center;padding:3rem 1.5rem;overflow-y:auto}
  .modal-bg.open{display:flex}
  .modal{width:100%;max-width:640px;background:var(--blue-rich);border:1px solid var(--line);border-radius:14px;padding:1.75rem}
  .modal h3{font-size:1.5rem;margin-bottom:1.25rem}
  .modal .field{margin-bottom:1rem}
  .modal-foot{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.5rem}

  /* toast */
  #toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:200;display:flex;flex-direction:column;gap:.5rem}
  .toast{background:var(--blue-deep);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:.75rem 1.1rem;font-size:.8rem;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:slideIn .25s}
  .toast.err{border-left-color:var(--err)}
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* Inhalte: Seiten-Tabs */
  .cms-tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem;position:sticky;top:0;background:var(--blue-rich);padding:.5rem 0;z-index:5}
  .cms-tab{background:var(--blue-deep);border:1px solid var(--line);color:rgba(255,255,255,.75);border-radius:20px;padding:.5rem .9rem;font-size:.78rem;font-weight:500;display:inline-flex;align-items:center;gap:.4rem;transition:.15s}
  .cms-tab:hover{border-color:var(--gold);color:var(--white)}
  .cms-tab.active{background:var(--gold);color:var(--blue-rich);border-color:var(--gold)}
  .cms-count{background:rgba(0,0,0,.12);border-radius:20px;padding:0 .4rem;font-size:.62rem;font-weight:700}
  .cms-tab:not(.active) .cms-count{background:rgba(255,255,255,.1)}
  .cms-page-title{margin:.25rem 0 1rem}.cms-page-title h3{font-size:1.5rem;color:var(--gold)}
  /* Spinner + Erfolg-Button */
  .spin{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .btn-ok{background:var(--ok);color:#083d22}

  @media(max-width:760px){
    #app{grid-template-columns:1fr}
    aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:.35rem}
    aside .spacer,.brand small{display:none}
    .brand{padding:.25rem .6rem;width:100%}
    main{padding:1.5rem 1.25rem}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <h1>Benleo Verlag</h1>
    <p class="sub">Verwaltung / Admin</p>
    <form id="loginForm">
      <div class="field"><label>E-Mail</label><input type="email" id="loginEmail" required autocomplete="username"></div>
      <div class="field"><label>Passwort</label><input type="password" id="loginPass" required autocomplete="current-password"></div>
      <button class="btn btn-gold" type="submit"><i data-lucide="log-in"></i> Anmelden</button>
    </form>
    <p class="hint" id="loginHint">Demo-Zugang: admin@benleo-verlag.de / benleo-admin</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <aside>
    <div class="brand">Benleo<small>Verwaltung</small></div>
    <button class="navlink active" data-view="dashboard"><i data-lucide="layout-dashboard"></i> Übersicht</button>
    <div class="nav-group">Katalog</div>
    <button class="navlink" data-view="products"><i data-lucide="book-open"></i> Produkte</button>
    <button class="navlink" data-view="categories"><i data-lucide="shapes"></i> Kategorien</button>
    <button class="navlink" data-view="artists"><i data-lucide="user-round"></i> Künstler</button>
    <button class="navlink" data-view="videos"><i data-lucide="clapperboard"></i> Lesungen &amp; Talks</button>
    <button class="navlink" data-view="events"><i data-lucide="calendar-days"></i> Veranstaltungen</button>
    <div class="nav-group">Anfragen &amp; Nutzer</div>
    <button class="navlink" data-view="submissions"><i data-lucide="inbox"></i> Einreichungen <span class="badge" id="subCount" style="display:none">0</span></button>
    <button class="navlink" data-view="newsletter"><i data-lucide="mail"></i> Newsletter <span class="badge" id="nlCount" style="display:none">0</span></button>
    <button class="navlink" data-view="profiles"><i data-lucide="users"></i> Profile <span class="badge" id="usrCount" style="display:none">0</span></button>
    <div class="nav-group">System</div>
    <button class="navlink" data-view="menu"><i data-lucide="menu"></i> Navigation</button>
    <button class="navlink" data-view="content"><i data-lucide="type"></i> Inhalte</button>
    <button class="navlink" data-view="plugins"><i data-lucide="puzzle"></i> Plugins</button>
    <div class="spacer"></div>
    <div class="whoami" id="whoami"></div>
    <button class="navlink" id="logoutBtn"><i data-lucide="log-out"></i> Abmelden</button>
  </aside>
  <main id="main"></main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ================= API layer ================= */
const API = location.origin + '/api';
let token = localStorage.getItem('benleo_admin_token') || '';
let me = null;
let cache = { products: [], categories: [], artists: [], events: [], content: {}, submissions: [] };

async function api(pathname, { method = 'GET', body, form } = {}) {
  const opts = { method, headers: {} };
  if (token) opts.headers.Authorization = 'Bearer ' + token;
  if (form) { opts.body = form; }
  else if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + pathname, opts);
  // Session expired / invalid token (e.g. after a server key change): make it
  // crystal clear instead of a cryptic "Fehler 401", and return to login.
  if (res.status === 401 && !pathname.startsWith('/auth/')) {
    token = ''; localStorage.removeItem('benleo_admin_token');
    toast('Sitzung abgelaufen — bitte neu anmelden.', true);
    setTimeout(() => location.reload(), 1400);
    throw new Error('Sitzung abgelaufen — bitte neu anmelden.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Fehler ' + res.status));
  return data;
}

function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ================= Auth ================= */
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const r = await api('/auth/login', { method: 'POST', body: {
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPass').value,
    }});
    if (r.user.role !== 'admin') { document.getElementById('loginHint').textContent = 'Dieser Account hat keine Admin-Rechte.'; return; }
    token = r.token; me = r.user;
    localStorage.setItem('benleo_admin_token', token);
    enterApp();
  } catch (err) {
    const h = document.getElementById('loginHint'); h.textContent = err.message; h.style.color = 'var(--err)';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  token = ''; me = null; localStorage.removeItem('benleo_admin_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
});

async function enterApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  document.getElementById('whoami').textContent = me ? (me.name || me.email) : '';
  await refreshAll();
  show('dashboard');
  lucide.createIcons();
}

async function refreshAll() {
  const [products, categories, artists, videos, events, content, submissions, subscribers, users, menu] = await Promise.all([
    api('/products'), api('/categories').catch(() => []), api('/artists').catch(() => []), api('/videos').catch(() => []), api('/events'), api('/content'), api('/submissions').catch(() => []), api('/plugins/newsletter/subscribers').catch(() => []), api('/admin/users').catch(() => []), api('/menu').catch(() => null),
  ]);
  cache = { products, categories, artists, videos, events, content, submissions, subscribers, users, menu };
  const neu = submissions.filter(s => s.status === 'neu').length;
  const b = document.getElementById('subCount');
  b.textContent = neu; b.style.display = neu ? 'inline-block' : 'none';
  const nl = document.getElementById('nlCount');
  if (nl) { nl.textContent = subscribers.length; nl.style.display = subscribers.length ? 'inline-block' : 'none'; }
  const u = document.getElementById('usrCount');
  if (u) { u.textContent = users.length; u.style.display = users.length ? 'inline-block' : 'none'; }
}

/* ================= Router ================= */
document.querySelectorAll('.navlink[data-view]').forEach(btn =>
  btn.addEventListener('click', () => show(btn.dataset.view)));

function show(view) {
  document.querySelectorAll('.navlink[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  ({ dashboard: viewDashboard, products: viewProducts, categories: viewCategories, artists: viewArtists, videos: viewVideos, events: viewEvents, menu: viewMenu, content: viewContent, plugins: viewPlugins, submissions: viewSubmissions, newsletter: viewNewsletter, profiles: viewProfiles }[view] || viewDashboard)();
  lucide.createIcons();
}

/* ================= Views ================= */
function statusPill(s){ return s==='coming_soon'?'<span class="pill pill-soon">Coming soon</span>':'<span class="pill pill-pub">Veröffentlicht</span>'; }

function viewDashboard() {
  const c = cache;
  const neu = c.submissions.filter(s => s.status === 'neu').length;
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Übersicht</h2><p>Willkommen zurück. Hier verwaltest du die gesamte Website.</p></div></div>
    <div class="grid2">
      ${statCard('book-open','Produkte', c.products.length,'products')}
      ${statCard('clapperboard','Lesungen & Talks', (c.videos||[]).length,'videos')}
      ${statCard('calendar-days','Veranstaltungen', c.events.length,'events')}
      ${statCard('type','Text-Blöcke', Object.keys(c.content).length,'content')}
      ${statCard('inbox','Einreichungen', c.submissions.length + (neu?` · ${neu} neu`:''),'submissions')}
    </div>
    <div class="card" style="margin-top:1rem">
      <h3 style="font-size:1.2rem;margin-bottom:.5rem">Was du hier tun kannst</h3>
      <p class="muted" style="font-size:.82rem;line-height:1.7">
        Produkte anlegen und bearbeiten (inkl. „Coming soon"/geblurrt), Veranstaltungen &amp; Werkstätten pflegen,
        alle Texte zweisprachig (DE/EN) ändern und eingehende Einreichungen inkl. hochgeladener Dateien einsehen.
      </p>
    </div>`;
  document.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => show(el.dataset.goto)));
}
function statCard(icon,label,val,goto){
  return `<div class="card" style="cursor:pointer" data-goto="${goto}">
    <div style="display:flex;align-items:center;gap:.7rem;color:var(--gold)"><i data-lucide="${icon}"></i>
      <span style="font-size:.7rem;letter-spacing:.12em;text-transform:uppercase">${label}</span></div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:2.4rem;color:var(--white);margin-top:.4rem">${val}</div>
  </div>`;
}

/* ---- Products ---- */
function viewProducts() {
  const items = cache.products;
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Produkte</h2><p>Bücher, Hörbücher und weitere Titel.</p></div>
      <button class="btn btn-gold" id="addProduct"><i data-lucide="plus"></i> Neues Produkt</button></div>
    <div id="productList">${items.length ? items.map(productRow).join('') : '<div class="empty">Noch keine Produkte.</div>'}</div>`;
  document.getElementById('addProduct').addEventListener('click', () => productModal());
  bindRowActions('product', cache.products, productModal, async id => { await api('/products/'+id,{method:'DELETE'}); toast('Produkt gelöscht'); });
}
function productRow(p){
  const thumb = p.coverKey
    ? `<img src="${location.origin}/api/media/${esc(p.coverKey)}" alt="" style="width:38px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex-shrink:0">`
    : `<div style="width:38px;height:52px;border-radius:4px;border:1px dashed var(--line);flex-shrink:0"></div>`;
  return `<div class="list-item">
    ${thumb}
    <div class="li-main"><div class="li-title">${esc(p.title?.de||'—')} ${p.blurName?'<span class="pill pill-soon">blur</span>':''}</div>
      <div class="li-meta">${esc(p.type)} · ${esc(p.author||'—')} · ${statusPill(p.status)}</div></div>
    <div class="li-actions">
      <button class="btn btn-ghost btn-sm" data-edit="product" data-id="${p.id}"><i data-lucide="pencil"></i></button>
      <button class="btn btn-danger btn-sm" data-del="product" data-id="${p.id}"><i data-lucide="trash-2"></i></button></div>
  </div>`;
}
// small helper: upload a file via presign, resolve with its key. onProg(percent) is optional.
function uploadKey(file, kind, onProg){
  const ct = file.type || 'application/octet-stream';
  return api('/uploads/presign', { method:'POST', body:{ filename:file.name, contentType:ct, kind } })
    .then(pre => new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('PUT',pre.url); x.setRequestHeader('Content-Type',ct);
      x.upload.onprogress=e=>{ if(e.lengthComputable && onProg) onProg(Math.round(e.loaded/e.total*100)); };
      x.onload=()=>x.status>=200&&x.status<300?res(pre.key):rej(new Error('Upload '+x.status)); x.onerror=()=>rej(new Error('Netzwerkfehler')); x.send(file); }));
}
// shared upload-status helper: updates a status element with progress + result
function uploadStatus(el){
  const set=(m,c)=>{ if(el){ el.style.display=''; el.textContent=m; el.style.color = c==='ok'?'#7fd6a3':(c==='err'?'var(--warn)':'var(--muted)'); } };
  return { start:()=>set('⏳ Wird hochgeladen…'), prog:pct=>set('⏳ Wird hochgeladen… '+pct+'%'), ok:(m)=>set(m||'✓ Hochgeladen','ok'), err:m=>set('Fehler: '+m,'err') };
}
function subhead(t){ return `<div style="margin:1.4rem 0 .3rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--gold);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase">${esc(t)}</div>`; }
function productModal(p){
  const isNew = !p; p = p || { title:{de:'',en:''}, description:{de:'',en:''}, type:'roman', status:'published', author:'', amazonUrl:'', blurName:false, coverKey:null };
  let coverKey = p.coverKey || null;
  let gallery = (Array.isArray(p.gallery)?p.gallery:[]).map(g=>({ imageKey:g.imageKey||null, caption:g.caption||'' }));
  let audio = (Array.isArray(p.audio)?p.audio:[]).map(a=>({ label:a.label||'', audioKey:a.audioKey||null, audioUrl:a.audioUrl||'' }));
  let videos = (Array.isArray(p.video)?p.video:[]).map(v=>({ label:v.label||'', videoKey:v.videoKey||null, videoUrl:v.videoUrl||'' }));
  let pages = (Array.isArray(p.samplePages)?p.samplePages.slice():[]);
  const coverSrc = coverKey ? (location.origin + '/api/media/' + coverKey) : '';
  const cats = cache.categories || [];
  const media = k => location.origin + '/api/media/' + k;
  openModal(`${isNew?'Neues Produkt':'Produkt bearbeiten'}`, `
    <div class="field"><label>Cover-Bild (quadratisch empfohlen)</label>
      <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">

      <div class="field"><label>Autor:in (Kurz-Angabe)</label><input id="p_author" value="${esc(p.author)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Kurzinfo unter Cover (DE)</label><input id="p_side" value="${esc(p.shortInfo?.de)}" placeholder="z. B. Musikstück, Hörbuch, Fotografie"></div>
      <div class="field"><label>Kurzinfo unter Cover (EN)</label><input id="p_sien" value="${esc(p.shortInfo?.en)}"></div>

    <div class="field"><label>Amazon-Link</label><input id="p_amazon" value="${esc(p.amazonUrl)}" placeholder="https://..."></div>
    <div class="field"><label>Kurzbeschreibung (DE)</label><textarea id="p_dde">${esc(p.description?.de)}</textarea></div>
    <div class="field"><label>Kurzbeschreibung (EN)</label><textarea id="p_den">${esc(p.description?.en)}</textarea></div>
    <div class="field"><label style="display:flex;align-items:center;gap:.5rem;text-transform:none;letter-spacing:0;font-size:.82rem;color:var(--white)">
      <input type="checkbox" id="p_blur" ${p.blurName?'checked':''} style="width:auto"> Titel geblurrt anzeigen (Name noch geheim)</label></div>

    ${subhead('Detailseite — ausführlicher Text (Plot / Entstehung)')}
    <div class="field"><label>Ausführlicher Text (DE)</label><textarea id="p_bde" style="min-height:110px">${esc(p.bodyText?.de)}</textarea></div>
    <div class="field"><label>Ausführlicher Text (EN)</label><textarea id="p_ben" style="min-height:110px">${esc(p.bodyText?.en)}</textarea></div>

    ${subhead('Künstler:in (verknüpft)')}
    <div class="field"><label>Künstler:in auswählen</label>
      <select id="p_artistId">
        <option value="">— keine —</option>
        ${(cache.artists||[]).map(ar=>`<option value="${esc(ar.id)}" ${p.artistId===ar.id?'selected':''}>${esc(ar.name)}${ar.role?.de?(' — '+esc(ar.role.de)):''}</option>`).join('')}
      </select>
      <div class="muted" style="font-size:.72rem;margin-top:.4rem">Profilfoto, Beschreibung &amp; Titelbild pflegst du unter „Künstler". Auf der Produktseite wird das Profil automatisch angezeigt &amp; verlinkt.</div>
    </div>

    ${subhead('Medien &amp; Detailseite')}
    <details class="p-sec"><summary>Bildergalerie (Bildende Kunst)</summary>
      <div id="p_gallery" style="display:flex;flex-direction:column;gap:.6rem"></div>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;margin-top:.6rem"><i data-lucide="plus"></i> Bild hinzufügen<input type="file" id="p_gadd" accept="image/*" style="display:none"></label>
      <span id="p_gstatus" class="muted" style="font-size:.72rem;margin-left:.6rem;display:none"></span>
    </details>
    <details class="p-sec"><summary>Audio-Beispiele (MP3 / WAV)</summary>
      <div id="p_audio" style="display:flex;flex-direction:column;gap:.6rem"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="p_aadd" style="margin-top:.6rem"><i data-lucide="plus"></i> Audio hinzufügen</button>
    </details>
    <details class="p-sec"><summary>Videos (Upload MP4/WebM oder Link)</summary>
      <div id="p_video" style="display:flex;flex-direction:column;gap:.6rem"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="p_vadd" style="margin-top:.6rem"><i data-lucide="plus"></i> Video hinzufügen</button>
    </details>
    <details class="p-sec"><summary>Leseprobe-Seiten (Literatur) — zum Durchblättern</summary>
      <div id="p_sample" style="display:flex;flex-wrap:wrap;gap:.6rem"></div>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;margin-top:.6rem"><i data-lucide="plus"></i> Seite hinzufügen<input type="file" id="p_sadd" accept="image/*" style="display:none"></label>
      <span id="p_sstatus" class="muted" style="font-size:.72rem;margin-left:.6rem;display:none"></span>
    </details>
  `, async () => {
    syncGallery(); syncAudio(); syncVideo();
    const payload = {
      title:{de:val('p_tde'),en:val('p_ten')}, description:{de:val('p_dde'),en:val('p_den')},
      type:val('p_type'), status:val('p_status'), author:val('p_author'), amazonUrl:val('p_amazon'),
      blurName:document.getElementById('p_blur').checked, coverKey: coverKey,
      category: val('p_category'), shortInfo:{de:val('p_side'),en:val('p_sien')}, bodyText:{de:val('p_bde'),en:val('p_ben')},
      artistId: val('p_artistId'),
      gallery: gallery.filter(g=>g.imageKey), audio: audio.filter(a=>a.audioKey||String(a.audioUrl||'').trim()), video: videos.filter(v=>v.videoKey||String(v.videoUrl||'').trim()), samplePages: pages.filter(Boolean),
    };
    if (isNew) await api('/products',{method:'POST',body:payload});
    else await api('/products/'+p.id,{method:'PUT',body:payload});
    toast('Produkt gespeichert');
  });

  // ---- cover + artist photo ----
  function showPrev(prevId,phId,k){ const pr=document.getElementById(prevId),ph=document.getElementById(phId); if(pr){ pr.src=media(k)+'?t='+Date.now(); pr.style.display=''; } if(ph)ph.style.display='none'; }
  wireImg('p_cover_input', k=>{ coverKey=k; showPrev('p_cover_prev','p_cover_ph',k); }, 'p_cover_name', '✓ Hochgeladen — mit „Speichern" übernehmen');
  function wireImg(id, onKey, statusId, okMsg){
    const el=document.getElementById(id); if(!el) return;
    el.addEventListener('change', async ()=>{
      const f=el.files[0]; if(!f) return;
      const st=uploadStatus(statusId?document.getElementById(statusId):null); st.start();
      try{ const k=await uploadKey(f,'content',st.prog); onKey(k); st.ok(okMsg); toast('Bild hochgeladen ✓'); }
      catch(e){ st.err(e.message); toast(e.message,true); }
      el.value='';
    });
  }

  // ---- gallery ----
  function syncGallery(){ gallery.forEach((g,i)=>{ const c=document.getElementById('p_gcap_'+i); if(c) g.caption=c.value; }); }
  function renderGallery(){ const host=document.getElementById('p_gallery'); if(!host) return;
    host.innerHTML = gallery.map((g,i)=>`<div style="display:flex;gap:.6rem;align-items:center;border:1px solid var(--line);border-radius:8px;padding:.5rem">
      <img src="${media(g.imageKey)}" style="width:48px;height:48px;object-fit:cover;border-radius:4px;flex-shrink:0">
      <input id="p_gcap_${i}" value="${esc(g.caption||'')}" placeholder="Bildunterschrift (optional)" style="flex:1">
      <button type="button" class="btn btn-danger btn-sm" data-gdel="${i}"><i data-lucide="trash-2"></i></button></div>`).join('') || '<span class="muted" style="font-size:.72rem">Noch keine Bilder.</span>';
    lucide.createIcons();
    host.querySelectorAll('[data-gdel]').forEach(b=>b.addEventListener('click',()=>{ syncGallery(); gallery.splice(+b.dataset.gdel,1); renderGallery(); }));
  }
  const gadd=document.getElementById('p_gadd'); if(gadd) gadd.addEventListener('change', async ()=>{ const f=gadd.files[0]; if(!f) return; const st=uploadStatus(document.getElementById('p_gstatus')); st.start(); try{ syncGallery(); const k=await uploadKey(f,'content',st.prog); gallery.push({imageKey:k,caption:''}); renderGallery(); st.ok('✓ Bild hinzugefügt'); toast('Bild hinzugefügt ✓'); }catch(e){ st.err(e.message); toast(e.message,true); } gadd.value=''; });

  // ---- audio ----
  function syncAudio(){ audio.forEach((a,i)=>{ const l=document.getElementById('p_alabel_'+i); if(l) a.label=l.value; const u=document.getElementById('p_aurl_'+i); if(u && !a.audioKey) a.audioUrl=u.value; }); }
  function renderAudio(){ const host=document.getElementById('p_audio'); if(!host) return;
    host.innerHTML = audio.map((a,i)=>`<div style="border:1px solid var(--line);border-radius:8px;padding:.6rem">
      <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.4rem">
        <input id="p_alabel_${i}" value="${esc(a.label||'')}" placeholder="Titel des Stücks" style="flex:1">
        <button type="button" class="btn btn-danger btn-sm" data-adel="${i}"><i data-lucide="trash-2"></i></button></div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer"><i data-lucide="upload"></i> Audio-Datei<input type="file" data-afile="${i}" accept="audio/*" style="display:none"></label>
        <span style="color:var(--muted);font-size:.7rem">oder</span>
        <input id="p_aurl_${i}" value="${esc(a.audioKey?'':(a.audioUrl||''))}" placeholder="Audio-Link (URL)" style="flex:1;min-width:160px" ${a.audioKey?'disabled':''}>
        <span class="muted" style="font-size:.7rem">${a.audioKey?('Datei: '+esc(a.audioKey.split('/').pop())):''}</span>
        <span data-aprog="${i}" class="muted" style="font-size:.7rem;display:none"></span>
        ${a.audioKey?`<button type="button" class="btn btn-ghost btn-sm" data-aclear="${i}"><i data-lucide="x"></i></button>`:''}</div></div>`).join('') || '<span class="muted" style="font-size:.72rem">Noch keine Audios.</span>';
    lucide.createIcons();
    host.querySelectorAll('[data-adel]').forEach(b=>b.addEventListener('click',()=>{ syncAudio(); audio.splice(+b.dataset.adel,1); renderAudio(); }));
    host.querySelectorAll('[data-aclear]').forEach(b=>b.addEventListener('click',()=>{ syncAudio(); audio[+b.dataset.aclear].audioKey=null; renderAudio(); }));
    host.querySelectorAll('[data-afile]').forEach(fi=>fi.addEventListener('change', async ()=>{ const f=fi.files[0]; if(!f) return; const i=+fi.dataset.afile; const st=uploadStatus(host.querySelector('[data-aprog="'+i+'"]')); st.start(); try{ syncAudio(); audio[i].audioKey=await uploadKey(f,'audio',st.prog); audio[i].audioUrl=''; renderAudio(); toast('Audio hochgeladen ✓'); }catch(e){ st.err(e.message); toast(e.message,true); } }));
  }
  const aadd=document.getElementById('p_aadd'); if(aadd) aadd.addEventListener('click',()=>{ syncAudio(); audio.push({label:'',audioKey:null,audioUrl:''}); renderAudio(); });

  // ---- video (upload MP4/WebM or URL) ----
  function syncVideo(){ videos.forEach((v,i)=>{ const l=document.getElementById('p_vlabel_'+i); if(l) v.label=l.value; const u=document.getElementById('p_vurl_'+i); if(u && !v.videoKey) v.videoUrl=u.value; }); }
  function renderVideoList(){ const host=document.getElementById('p_video'); if(!host) return;
    host.innerHTML = videos.map((v,i)=>`<div style="border:1px solid var(--line);border-radius:8px;padding:.6rem">
      <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.4rem">
        <input id="p_vlabel_${i}" value="${esc(v.label||'')}" placeholder="Titel des Videos" style="flex:1">
        <button type="button" class="btn btn-danger btn-sm" data-vdel="${i}"><i data-lucide="trash-2"></i></button></div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer"><i data-lucide="upload"></i> Video-Datei<input type="file" data-vfile="${i}" accept="video/*" style="display:none"></label>
        <span style="color:var(--muted);font-size:.7rem">oder</span>
        <input id="p_vurl_${i}" value="${esc(v.videoKey?'':(v.videoUrl||''))}" placeholder="YouTube / Vimeo / Link" style="flex:1;min-width:160px" ${v.videoKey?'disabled':''}>
        <span class="muted" style="font-size:.7rem">${v.videoKey?('Datei: '+esc(v.videoKey.split('/').pop())):''}</span>
        <span data-vprog="${i}" class="muted" style="font-size:.7rem;display:none"></span>
        ${v.videoKey?`<button type="button" class="btn btn-ghost btn-sm" data-vclear="${i}"><i data-lucide="x"></i></button>`:''}</div></div>`).join('') || '<span class="muted" style="font-size:.72rem">Noch keine Videos.</span>';
    lucide.createIcons();
    host.querySelectorAll('[data-vdel]').forEach(b=>b.addEventListener('click',()=>{ syncVideo(); videos.splice(+b.dataset.vdel,1); renderVideoList(); }));
    host.querySelectorAll('[data-vclear]').forEach(b=>b.addEventListener('click',()=>{ syncVideo(); videos[+b.dataset.vclear].videoKey=null; renderVideoList(); }));
    host.querySelectorAll('[data-vfile]').forEach(fi=>fi.addEventListener('change', async ()=>{ const f=fi.files[0]; if(!f) return; const i=+fi.dataset.vfile; const st=uploadStatus(host.querySelector('[data-vprog="'+i+'"]')); st.start(); try{ syncVideo(); videos[i].videoKey=await uploadKey(f,'video',st.prog); videos[i].videoUrl=''; renderVideoList(); toast('Video hochgeladen ✓'); }catch(e){ st.err(e.message); toast(e.message,true); } }));
  }
  const vadd=document.getElementById('p_vadd'); if(vadd) vadd.addEventListener('click',()=>{ syncVideo(); videos.push({label:'',videoKey:null,videoUrl:''}); renderVideoList(); });

  // ---- sample pages ----
  function renderSample(){ const host=document.getElementById('p_sample'); if(!host) return;
    host.innerHTML = pages.map((k,i)=>`<div style="position:relative;width:66px">
      <img src="${media(k)}" style="width:66px;height:90px;object-fit:cover;border-radius:4px;border:1px solid var(--line)">
      <span style="position:absolute;top:2px;left:2px;background:var(--gold);color:var(--blue-rich);font-size:.6rem;font-weight:700;padding:0 .3rem;border-radius:3px">${i+1}</span>
      <button type="button" class="btn btn-danger btn-sm" data-sdel="${i}" style="position:absolute;top:2px;right:2px;padding:.1rem .3rem"><i data-lucide="x"></i></button></div>`).join('') || '<span class="muted" style="font-size:.72rem">Noch keine Seiten.</span>';
    lucide.createIcons();
    host.querySelectorAll('[data-sdel]').forEach(b=>b.addEventListener('click',()=>{ pages.splice(+b.dataset.sdel,1); renderSample(); }));
  }
  const sadd=document.getElementById('p_sadd'); if(sadd) sadd.addEventListener('change', async ()=>{ const f=sadd.files[0]; if(!f) return; const st=uploadStatus(document.getElementById('p_sstatus')); st.start(); try{ const k=await uploadKey(f,'content',st.prog); pages.push(k); renderSample(); st.ok('✓ Seite hinzugefügt'); toast('Seite hinzugefügt ✓'); }catch(e){ st.err(e.message); toast(e.message,true); } sadd.value=''; });

  renderGallery(); renderAudio(); renderVideoList(); renderSample();
}

/* ---- Categories (Bildende Kunst / Literatur / Musik) ---- */
function viewCategories(){
  const items = (cache.categories||[]).slice();
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Kategorien</h2><p>Bildende Kunst · Literatur · Musik — Einleitungstexte, Kopfbild &amp; Reihenfolge.</p></div>
      <button class="btn btn-gold" id="addCat"><i data-lucide="plus"></i> Neue Kategorie</button></div>
    <div>${items.length ? items.map(catRow).join('') : '<div class="empty">Noch keine Kategorien.</div>'}</div>`;
  document.getElementById('addCat').addEventListener('click', ()=>categoryModal());
  items.forEach(c=>{
    const eb=document.querySelector(`[data-editcat="${c.key}"]`); if(eb) eb.addEventListener('click',()=>categoryModal(c));
    const db=document.querySelector(`[data-delcat="${c.key}"]`); if(db) db.addEventListener('click', async ()=>{ if(!confirm('Kategorie wirklich löschen?')) return; try{ await api('/categories/'+c.key,{method:'DELETE'}); toast('Kategorie gelöscht'); await refreshAll(); rerender(); }catch(e){ toast(e.message,true); } });
  });
}
function catRow(c){
  const hero = c.heroImageKey
    ? `<img src="${location.origin}/api/media/${esc(c.heroImageKey)}" alt="" style="width:56px;height:38px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex-shrink:0">`
    : `<div style="width:56px;height:38px;border-radius:4px;border:1px dashed var(--line);flex-shrink:0"></div>`;
  const count = (cache.products||[]).filter(p=>p.category===c.key).length;
  return `<div class="list-item">${hero}
    <div class="li-main"><div class="li-title">${esc(c.name?.de||c.key)}</div>
      <div class="li-meta">Schlüssel: ${esc(c.key)} · ${count} Produkt(e)</div></div>
    <div class="li-actions">
      <button class="btn btn-ghost btn-sm" data-editcat="${esc(c.key)}"><i data-lucide="pencil"></i></button>
      <button class="btn btn-danger btn-sm" data-delcat="${esc(c.key)}"><i data-lucide="trash-2"></i></button></div>
  </div>`;
}
function categoryModal(c){
  const isNew=!c; c=c||{key:'',name:{de:'',en:''},intro:{de:'',en:''},heroImageKey:null,order:99};
  let heroKey=c.heroImageKey||null;
  const media=k=>location.origin+'/api/media/'+k;
  openModal(`${isNew?'Neue Kategorie':'Kategorie bearbeiten'}`, `
    <div class="grid2">
      <div class="field"><label>Schlüssel (key)</label><input id="c_key" value="${esc(c.key)}" ${isNew?'':'disabled'} placeholder="z. B. kunst"></div>
      <div class="field"><label>Reihenfolge</label><input id="c_order" type="number" value="${c.order||99}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Name (DE)</label><input id="c_nde" value="${esc(c.name?.de)}"></div>
      <div class="field"><label>Name (EN)</label><input id="c_nen" value="${esc(c.name?.en)}"></div>
    </div>
    <div class="field"><label>Einleitungstext (DE)</label><textarea id="c_ide">${esc(c.intro?.de)}</textarea></div>
    <div class="field"><label>Einleitungstext (EN)</label><textarea id="c_ien">${esc(c.intro?.en)}</textarea></div>
    <div class="field"><label>Kopfbild (optional)</label>
      <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
        <img id="c_hero_prev" src="${heroKey?esc(media(heroKey)):''}" alt="" style="width:96px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);${heroKey?'':'display:none'}">
        <div id="c_hero_ph" style="width:96px;height:54px;border-radius:6px;border:1px dashed var(--line);display:${heroKey?'none':'flex'};align-items:center;justify-content:center;color:var(--muted);font-size:.7rem">kein Bild</div>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer"><i data-lucide="upload"></i> Bild hochladen<input type="file" id="c_hero_input" accept="image/*" style="display:none"></label>
      </div></div>
  `, async ()=>{
    const key=(val('c_key')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
    if(!key) throw new Error('Bitte einen Schlüssel angeben');
    const payload={ key, name:{de:val('c_nde'),en:val('c_nen')}, intro:{de:val('c_ide'),en:val('c_ien')}, heroImageKey:heroKey, order:parseInt(val('c_order'),10)||99 };
    if(isNew) await api('/categories',{method:'POST',body:payload});
    else await api('/categories/'+c.key,{method:'PUT',body:payload});
    toast('Kategorie gespeichert');
  });
  const hi=document.getElementById('c_hero_input');
  if(hi) hi.addEventListener('change', async ()=>{ const f=hi.files[0]; if(!f) return; try{ heroKey=await uploadKey(f,'content'); const pr=document.getElementById('c_hero_prev'),ph=document.getElementById('c_hero_ph'); pr.src=media(heroKey)+'?t='+Date.now(); pr.style.display=''; if(ph)ph.style.display='none'; toast('Bild hochgeladen'); }catch(e){ toast(e.message,true); } });
}

/* ---- Artists (Künstler:innen / Autor:innen / Musiker:innen) ---- */

function artistRow(a){

    <div class="li-main"><div class="li-title">${esc(a.name||'—')}</div>

    <div class="li-actions">
      <button class="btn btn-ghost btn-sm" data-edit="artist" data-id="${a.id}"><i data-lucide="pencil"></i></button>
      <button class="btn btn-danger btn-sm" data-del="artist" data-id="${a.id}"><i data-lucide="trash-2"></i></button></div>
  </div>`;
}
function artistModal(a){

// generic single-image upload wiring with progress (reused by artist/category)
function showPreview(prevId,phId,k){ const pr=document.getElementById(prevId),ph=document.getElementById(phId); if(pr){ pr.src=location.origin+'/api/media/'+k+'?t='+Date.now(); pr.style.display=''; } if(ph)ph.style.display='none'; }
function wireUpload(id, onKey, statusId, kind){
  const el=document.getElementById(id); if(!el) return;
  el.addEventListener('change', async ()=>{ const f=el.files[0]; if(!f) return; const st=uploadStatus(statusId?document.getElementById(statusId):null); st.start();
    try{ const k=await uploadKey(f, kind||'content', st.prog); onKey(k); st.ok(); toast('Hochgeladen ✓'); }catch(e){ st.err(e.message); toast(e.message,true); } el.value=''; });
}

let menuModel = [];
const mClone = x => JSON.parse(JSON.stringify(x));
function viewMenu(){
  const cfg = cache.menu;
  menuModel = (cfg && Array.isArray(cfg.items) && cfg.items.length) ? mClone(cfg.items) : mClone(DEFAULT_MENU);
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Navigation</h2><p>Menüpunkte &amp; Dropdowns der Website — anlegen, umbenennen, sortieren, verlinken. „Automatische Liste" zieht Kategorien/Künstler selbst.</p></div>
      <button class="btn btn-gold" id="menuSave"><i data-lucide="save"></i> Navigation speichern</button></div>
    <datalist id="linkList">${KNOWN_LINKS.map(l=>`<option value="${l}">`).join('')}</datalist>

  renderTree();
  document.getElementById('menuAddTop').addEventListener('click', ()=>{ syncMenu(); menuModel.push({label:{de:'Neu',en:'New'},href:'',children:[]}); renderTree(); });
  document.getElementById('menuSave').addEventListener('click', saveMenu);

function renderTree(){
  const host=document.getElementById('menuTree'); if(!host) return;
  host.innerHTML = menuModel.map((it,i)=>menuTopCard(it,i)).join('') || '<div class="empty">Keine Menüpunkte.</div>';
  lucide.createIcons();
  const q=(s,f)=>host.querySelectorAll(s).forEach(f);
  q('[data-mup]',b=>b.addEventListener('click',()=>{ syncMenu(); const i=+b.dataset.mup; if(i>0){ [menuModel[i-1],menuModel[i]]=[menuModel[i],menuModel[i-1]]; renderTree(); } }));
  q('[data-mdown]',b=>b.addEventListener('click',()=>{ syncMenu(); const i=+b.dataset.mdown; if(i<menuModel.length-1){ [menuModel[i+1],menuModel[i]]=[menuModel[i],menuModel[i+1]]; renderTree(); } }));
  q('[data-mdel]',b=>b.addEventListener('click',()=>{ syncMenu(); menuModel.splice(+b.dataset.mdel,1); renderTree(); }));
  q('[data-maddsub]',b=>b.addEventListener('click',()=>{ syncMenu(); const i=+b.dataset.maddsub; menuModel[i].children=menuModel[i].children||[]; menuModel[i].children.push({label:{de:'Neu',en:'New'},href:''}); renderTree(); }));
  q('[data-maddcat]',b=>b.addEventListener('click',()=>{ syncMenu(); const i=+b.dataset.maddcat; menuModel[i].children=menuModel[i].children||[]; menuModel[i].children.push({dynamic:'categories'}); renderTree(); }));
  q('[data-maddart]',b=>b.addEventListener('click',()=>{ syncMenu(); const i=+b.dataset.maddart; menuModel[i].children=menuModel[i].children||[]; menuModel[i].children.push({dynamic:'artists'}); renderTree(); }));
  q('[data-sup]',b=>b.addEventListener('click',()=>{ syncMenu(); const [i,j]=b.dataset.sup.split('_').map(Number); const a=menuModel[i].children; if(j>0){ [a[j-1],a[j]]=[a[j],a[j-1]]; renderTree(); } }));
  q('[data-sdown]',b=>b.addEventListener('click',()=>{ syncMenu(); const [i,j]=b.dataset.sdown.split('_').map(Number); const a=menuModel[i].children; if(j<a.length-1){ [a[j+1],a[j]]=[a[j],a[j+1]]; renderTree(); } }));
  q('[data-sdel]',b=>b.addEventListener('click',()=>{ syncMenu(); const [i,j]=b.dataset.sdel.split('_').map(Number); menuModel[i].children.splice(j,1); renderTree(); }));
}
function menuTopCard(it,i){
  it.children = it.children||[];
  return `<div class="card" style="margin-bottom:1rem">
    <div class="grid2">
      <div class="field"><label>Menüpunkt (DE)</label><input id="m_${i}_lde" value="${esc(it.label?.de)}"></div>

      <button class="btn btn-ghost btn-sm" data-mup="${i}" title="hoch"><i data-lucide="arrow-up"></i></button>
      <button class="btn btn-ghost btn-sm" data-mdown="${i}" title="runter"><i data-lucide="arrow-down"></i></button>
      <button class="btn btn-danger btn-sm" data-mdel="${i}" title="löschen"><i data-lucide="trash-2"></i></button>

        <button class="btn btn-ghost btn-sm" data-maddart="${i}"><i data-lucide="user-round"></i> Auto: Künstler</button>
      </div>
    </div>
  </div>`;
}
function menuSubRow(c,i,j){
  if(c.dynamic){
    return `<div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;background:rgba(249,211,134,.07);border:1px solid var(--line);border-radius:6px;padding:.5rem .7rem">

      <div style="margin-left:auto;display:flex;gap:.3rem">
        <button class="btn btn-ghost btn-sm" data-sup="${i}_${j}"><i data-lucide="arrow-up"></i></button>
        <button class="btn btn-ghost btn-sm" data-sdown="${i}_${j}"><i data-lucide="arrow-down"></i></button>
        <button class="btn btn-danger btn-sm" data-sdel="${i}_${j}"><i data-lucide="x"></i></button></div></div>`;
  }
  return `<div style="border:1px solid var(--line);border-radius:6px;padding:.6rem;margin-bottom:.5rem">
    <div class="grid2"><div class="field" style="margin:0"><label>Unterpunkt (DE)</label><input id="s_${i}_${j}_lde" value="${esc(c.label?.de)}"></div>
      <div class="field" style="margin:0"><label>Unterpunkt (EN)</label><input id="s_${i}_${j}_len" value="${esc(c.label?.en)}"></div></div>
    <div style="display:flex;gap:.5rem;align-items:end;margin-top:.5rem">
      <div class="field" style="flex:1;margin:0"><label>Ziel-Link</label><input id="s_${i}_${j}_href" list="linkList" value="${esc(c.href||'')}"></div>
      <button class="btn btn-ghost btn-sm" data-sup="${i}_${j}"><i data-lucide="arrow-up"></i></button>
      <button class="btn btn-ghost btn-sm" data-sdown="${i}_${j}"><i data-lucide="arrow-down"></i></button>
      <button class="btn btn-danger btn-sm" data-sdel="${i}_${j}"><i data-lucide="trash-2"></i></button></div></div>`;
}
function syncMenu(){
  menuModel.forEach((it,i)=>{
    it.label=it.label||{de:'',en:''};
    const lde=document.getElementById('m_'+i+'_lde'); if(lde) it.label.de=lde.value;
    const len=document.getElementById('m_'+i+'_len'); if(len) it.label.en=len.value;
    const hf=document.getElementById('m_'+i+'_href'); if(hf) it.href=hf.value;
    (it.children||[]).forEach((c,j)=>{
      if(c.dynamic) return;
      c.label=c.label||{de:'',en:''};
      const cde=document.getElementById('s_'+i+'_'+j+'_lde'); if(cde) c.label.de=cde.value;
      const cen=document.getElementById('s_'+i+'_'+j+'_len'); if(cen) c.label.en=cen.value;
      const chf=document.getElementById('s_'+i+'_'+j+'_href'); if(chf) c.href=chf.value;
    });
  });
}
async function saveMenu(){
  syncMenu();
  const btn=document.getElementById('menuSave'); const o=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="spin"></i> Speichern…'; lucide.createIcons();
  try{
    await api('/menu',{method:'PUT',body:{items:menuModel}});
    cache.menu={items:mClone(menuModel)};
    btn.disabled=false; btn.classList.add('btn-ok'); btn.innerHTML='<i data-lucide="check"></i> Gespeichert &amp; live'; lucide.createIcons();
    setTimeout(()=>{ btn.classList.remove('btn-ok'); btn.innerHTML=o; lucide.createIcons(); },1800);
    toast('Navigation gespeichert');
  }catch(e){ btn.disabled=false; btn.innerHTML=o; lucide.createIcons(); toast(e.message,true); }
}

function videoRow(v){
  const thumb = v.posterKey
    ? `<img src="${location.origin}/api/media/${esc(v.posterKey)}" alt="" style="width:64px;height:38px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex-shrink:0">`
    : `<div style="width:64px;height:38px;border-radius:4px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)"><i data-lucide="clapperboard"></i></div>`;
  const clips = (v.clips && v.clips.length) ? v.clips.length : ((v.videoKey||v.videoUrl) ? 1 : 0);
  const cnt = `<i data-lucide="film"></i> ${clips} ${clips===1?'Video':'Videos'}`;
  const hidden = v.status === 'hidden' ? '<span class="pill pill-soon">versteckt</span>' : '<span class="pill pill-pub">sichtbar</span>';
  return `<div class="list-item">
    ${thumb}
    <div class="li-main"><div class="li-title">${esc(v.title?.de||'—')}</div>

      <button class="btn btn-danger btn-sm" data-del="video" data-id="${v.id}"><i data-lucide="trash-2"></i></button></div>
  </div>`;
}
function videoModal(v){

      ? v.clips.map(c=>({ label:c.label||'', videoKey:c.videoKey||null, videoUrl:c.videoUrl||'' }))

      </select></div>
    </div>

      <div id="v_clips" style="display:flex;flex-direction:column;gap:.7rem"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="v_addclip" style="margin-top:.7rem"><i data-lucide="plus"></i> Video / Teil hinzufügen</button>
    </div>
    <div class="field"><label>Titelbild / Kachel <span style="text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400">— wird als Vorschau-Kachel auf der Website angezeigt (empfohlen)</span></label>

        <div id="v_poster_ph" style="width:96px;height:54px;border-radius:6px;border:1px dashed var(--line);display:${posterKey?'none':'flex'};align-items:center;justify-content:center;color:var(--muted);font-size:.7rem">kein Bild</div>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer"><i data-lucide="image"></i> Bild hochladen<input type="file" id="v_poster_input" accept="image/*" style="display:none"></label>

    <div class="field"><label>Beschreibung (EN)</label><textarea id="v_den">${esc(v.description?.en)}</textarea></div>
  `, async () => {

      </div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer"><i data-lucide="upload"></i> Upload<input type="file" data-clipfile="${i}" accept="video/*" style="display:none"></label>
        <span style="color:var(--muted);font-size:.7rem">oder</span>
        <input id="v_clip_url_${i}" placeholder="Link (YouTube, Vimeo, AWS …)" value="${esc(c.videoKey?'':(c.videoUrl||''))}" style="flex:1;min-width:180px" ${c.videoKey?'disabled':''}>
        ${c.videoKey?`<button type="button" class="btn btn-ghost btn-sm" data-clipclear="${i}" title="Upload entfernen"><i data-lucide="x"></i></button>`:''}
      </div>
      <div data-clipstate="${i}" class="muted" style="font-size:.7rem;margin-top:.35rem;${state?'':'display:none'}">${state}</div>
    </div>`;
  }
  function renderClips(){
    const host=document.getElementById('v_clips'); if(!host) return;
    host.innerHTML = clips.map(clipRow).join('');
    lucide.createIcons();
    host.querySelectorAll('[data-clipdel]').forEach(b=>b.addEventListener('click',()=>{ syncClips(); clips.splice(+b.dataset.clipdel,1); if(!clips.length) clips.push({label:'',videoKey:null,videoUrl:''}); renderClips(); }));
    host.querySelectorAll('[data-clipclear]').forEach(b=>b.addEventListener('click',()=>{ syncClips(); clips[+b.dataset.clipclear].videoKey=null; renderClips(); }));
    host.querySelectorAll('[data-clipfile]').forEach(fi=>fi.addEventListener('change',()=>uploadClip(+fi.dataset.clipfile, fi)));
  }
  async function uploadClip(i, fi){
    const f=fi.files[0]; if(!f) return; syncClips();
    const ct=f.type||'video/mp4';
    const st=document.querySelector('[data-clipstate="'+i+'"]'); if(st){ st.style.display=''; st.textContent='Upload startet …'; }
    try {
      const pre = await api('/uploads/presign', { method:'POST', body:{ filename:f.name, contentType:ct, kind:'video' } });
      await new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('PUT',pre.url); x.setRequestHeader('Content-Type',ct);
        x.upload.onprogress=e=>{ if(e.lengthComputable && st) st.textContent='Upload: '+Math.round(e.loaded/e.total*100)+'%'; };
        x.onload=()=>x.status>=200&&x.status<300?res():rej(new Error('Upload '+x.status)); x.onerror=()=>rej(new Error('Netzwerkfehler')); x.send(f); });
      clips[i].videoKey=pre.key; clips[i].videoUrl=''; renderClips(); toast('Video hochgeladen');
    } catch(e){ if(st) st.textContent='Fehler: '+e.message; toast(e.message, true); }
  }
  document.getElementById('v_addclip').addEventListener('click', ()=>{ syncClips(); clips.push({label:'',videoKey:null,videoUrl:''}); renderClips(); });
  renderClips();

  // poster upload
  const pinp = document.getElementById('v_poster_input');
  if (pinp) pinp.addEventListener('change', async () => {
    const f = pinp.files[0]; if (!f) return;
    const ct = f.type || 'image/jpeg';
    try {
      const pre = await api('/uploads/presign', { method:'POST', body:{ filename:f.name, contentType:ct, kind:'content' } });
      await new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('PUT',pre.url); x.setRequestHeader('Content-Type',ct); x.onload=()=>x.status>=200&&x.status<300?res():rej(new Error('Upload '+x.status)); x.onerror=()=>rej(new Error('Netzwerkfehler')); x.send(f); });
      posterKey = pre.key;
      const prev=document.getElementById('v_poster_prev'), ph=document.getElementById('v_poster_ph');
      prev.src = location.origin + '/api/media/' + posterKey + '?t=' + Date.now(); prev.style.display=''; if(ph) ph.style.display='none';
      toast('Bild hochgeladen');
    } catch(e){ toast(e.message, true); }
  });
}

/* ---- Inhalte (universal CMS over all pages) ---- */
const CMS_PAGES = ['index.html','ueber-uns.html','programm.html','veranstaltungen.html','teil-werden.html','profil.html','team.html','presse.html','studio.html','galerie.html','talentschmiede.html','festival.html','werkstaetten.html','impressum.html','datenschutz.html','agb.html'];
const PAGE_TITLES = { global:'Allgemein (Footer & global)', mails:'E-Mails (automatisch)', start:'Startseite', index:'Startseite', about:'Über uns', team:'Team', programm:'Programm & Projekte', studio:'Studio BENLEO', galerie:'Galerie & Exposition', talentschmiede:'Talentschmiede', events:'Kulturveranstaltungen', festival:'Literaturfestival 2027', werkstaetten:'Werkstätten', join:'Teil werden', account:'Mein Konto', press:'Presse', impressum:'Impressum', datenschutz:'Datenschutz', agb:'AGB' };
let cmsFields = [];
let cmsActivePage = null;

// Load every page in a hidden iframe so its own site.js registers all fields
// with exactly the keys the public site uses.
async function scanPages(){
  const ifr = document.createElement('iframe');
  ifr.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1024px;height:10px;opacity:0;border:0';
  document.body.appendChild(ifr);
  for (const p of CMS_PAGES){
    await new Promise(res => { let done=false; const go=()=>{if(done)return;done=true;setTimeout(res,450);}; ifr.onload=go; setTimeout(go,4000); ifr.src = location.origin + '/' + p; });
  }
  ifr.remove();
}
async function viewContent(){
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Inhalte</h2><p>Alle Texte, Titel und Bilder aller Seiten — zweisprachig (DE/EN).</p></div>
      <button class="btn btn-ghost btn-sm" id="cmsRescan"><i data-lucide="refresh-cw"></i> Seiten neu einlesen</button></div>
    <div id="cmsBody"><div class="empty">Lädt…</div></div>`;
  document.getElementById('cmsRescan').addEventListener('click', rescanCms);
  lucide.createIcons();
  // Fields already live in the DB — show them instantly. Re-scanning all pages
  // (slow) only runs on the explicit "Seiten neu einlesen" button.
  try { cmsFields = await api('/admin/content-fields'); } catch(e){ cmsFields = []; }
  renderCmsFields();
}
async function rescanCms(){
  const btn = document.getElementById('cmsRescan');
  const orig = btn ? btn.innerHTML : '';
  if (btn){ btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="spin"></i> Seiten werden eingelesen…'; lucide.createIcons(); }
  try { await scanPages(); } catch(e){}
  try { cmsFields = await api('/admin/content-fields'); } catch(e){}
  renderCmsFields();
  if (btn){ btn.disabled = false; btn.innerHTML = orig; lucide.createIcons(); toast('Seiten neu eingelesen'); }
}
function renderCmsFields(){
  const host = document.getElementById('cmsBody');
  if (!host) return; // view was left before a deferred re-render fired
  if (!cmsFields.length){ host.innerHTML = '<div class="empty">Keine Felder gefunden.</div>'; return; }
  const byPage = {};
  cmsFields.forEach((f,i) => { (byPage[f.page] = byPage[f.page] || []).push(i); });
  const order = Object.keys(PAGE_TITLES).filter(p=>byPage[p]).concat(Object.keys(byPage).filter(p=>!PAGE_TITLES[p]));
  if (!cmsActivePage || !byPage[cmsActivePage]) cmsActivePage = order[0];
  const tabs = order.map(pg=>`<button class="cms-tab${pg===cmsActivePage?' active':''}" data-cms-page="${pg}">${esc(PAGE_TITLES[pg]||pg)}<span class="cms-count">${byPage[pg].length}</span></button>`).join('');
  const active = (byPage[cmsActivePage] || []).slice().sort((a,b)=>((cmsFields[a].order??9999)-(cmsFields[b].order??9999)));
  host.innerHTML = `<div class="cms-tabs">${tabs}</div>
    <div class="cms-page-title"><h3 class="serif">${esc(PAGE_TITLES[cmsActivePage]||cmsActivePage)}</h3></div>
    ${active.map(cmsFieldCard).join('')}`;
  // page tabs
  host.querySelectorAll('[data-cms-page]').forEach(b=>b.addEventListener('click',()=>{ cmsActivePage=b.dataset.cmsPage; renderCmsFields(); document.getElementById('main').scrollTop=0; window.scrollTo(0,0); }));
  // field handlers (only active page)
  active.forEach(i => {
    const f = cmsFields[i];
    if (f.type === 'image'){
      const inp = document.getElementById('cfimg_'+i);
      if (inp) inp.addEventListener('change', () => uploadCmsImage(i, inp));
    } else {
      const btn = document.querySelector(`[data-cf-save="${i}"]`);
      if (btn) btn.addEventListener('click', () => saveCmsText(i));
      const rst = document.querySelector(`[data-cf-reset="${i}"]`);
      if (rst) rst.addEventListener('click', () => resetCmsField(i));
    }
  });
  lucide.createIcons();
}
function cmsFieldCard(i){
  const f = cmsFields[i];
  const overridden = !!f.value;
  if (f.type === 'image'){
    const src = (f.value && f.value.img) ? f.value.img : (f.default && f.default.de) || '';
    const srcAbs = /^(https?:|\/)/.test(src) ? src : location.origin + '/' + src;
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
        <div style="font-weight:600;font-size:.85rem">${esc(f.label)} ${overridden?'<span class="pill pill-new">geändert</span>':''}</div></div>
      <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
        <img src="${esc(srcAbs)}" alt="" style="width:120px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">
        <label class="btn btn-ghost btn-sm" style="cursor:pointer"><i data-lucide="upload"></i> Bild ersetzen<input type="file" id="cfimg_${i}" accept="image/*" style="display:none"></label>
      </div></div>`;
  }
  const de = (f.value && f.value.de) ? f.value.de : (f.default&&f.default.de)||'';
  const en = (f.value && f.value.en) ? f.value.en : (f.default&&f.default.en)||'';
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
      <div style="font-weight:600;font-size:.85rem">${esc(f.label)} ${overridden?'<span class="pill pill-new">geändert</span>':'<span class="pill" style="background:rgba(255,255,255,.08);color:var(--muted)">Standard</span>'}</div>
      <div style="display:flex;gap:.4rem">
        ${overridden?`<button class="btn btn-ghost btn-sm" data-cf-reset="${i}">Zurücksetzen</button>`:''}
        <button class="btn btn-gold btn-sm" data-cf-save="${i}"><i data-lucide="save"></i> Speichern</button></div></div>
    <div class="grid2">
      <div class="field"><label>Deutsch</label><textarea id="cfde_${i}">${esc(de)}</textarea></div>
      <div class="field"><label>English</label><textarea id="cfen_${i}">${esc(en)}</textarea></div>
    </div></div>`;
}
async function saveCmsText(i){
  const f = cmsFields[i];
  const btn = document.querySelector(`[data-cf-save="${i}"]`);
  const orig = btn ? btn.innerHTML : '';
  if (btn){ btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="spin"></i> Speichern…'; lucide.createIcons(); }
  try {
    const body = { de: val('cfde_'+i), en: val('cfen_'+i) };
    await api('/content/'+encodeURIComponent(f.key), { method:'PUT', body });
    // confirm it is really saved & live (public site reads the same API)
    const live = await api('/content');
    const lv = live[f.key] || {};
    if (lv.de !== body.de || lv.en !== body.en) throw new Error('Live-Stand konnte nicht bestätigt werden');
    f.value = body;
    if (btn){ btn.disabled=false; btn.classList.remove('btn-gold'); btn.classList.add('btn-ok'); btn.innerHTML = '<i data-lucide="check"></i> Gespeichert & live'; lucide.createIcons(); }
    setTimeout(() => renderCmsFields(), 1500);
  } catch(e){
    if (btn){ btn.disabled=false; btn.innerHTML = orig; lucide.createIcons(); }
    toast(e.message, true);
  }
}
async function resetCmsField(i){
  const f = cmsFields[i];
  try { await api('/content/'+encodeURIComponent(f.key), { method:'PUT', body:{ de:'', en:'' } }); f.value = null; toast('Auf Standard zurückgesetzt'); renderCmsFields(); }
  catch(e){ toast(e.message, true); }
}
async function uploadCmsImage(i, inp){
  const f = cmsFields[i]; const file = inp.files[0]; if (!file) return;
  try {
    const ct = file.type || 'application/octet-stream';
    const pre = await api('/uploads/presign', { method:'POST', body:{ filename:file.name, contentType:ct, kind:'content' } });
    await new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('PUT',pre.url); x.setRequestHeader('Content-Type',ct); x.onload=()=>x.status>=200&&x.status<300?res():rej(new Error('Upload '+x.status)); x.onerror=()=>rej(new Error('Netzwerkfehler')); x.send(file); });
    const data = await api('/content/'+encodeURIComponent(f.key)+'/image', { method:'POST', body:{ fileKey: pre.key } });
    f.value = data.value; toast('Bild ersetzt'); renderCmsFields();
  } catch(e){ toast(e.message, true); }
}

function subModal(s){
  const fileLink = s.fileKey
    ? `<a class="btn btn-ghost btn-sm" href="${API}/files/${s.fileKey}?t=${encodeURIComponent(token)}" target="_blank"><i data-lucide="download"></i> ${esc(s.fileName)} (${Math.round((s.fileSize||0)/1024)} KB)</a>`
    : '<span class="muted">Keine Datei angehängt</span>';
  openModal('Einreichung', `
    <div class="grid2">
      <div class="field"><label>Name</label><div>${esc(s.name)}</div></div>
      <div class="field"><label>E-Mail</label><div><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></div></div>
    </div>
    <div class="field"><label>Profil</label><div>${s.userId?'<span style="color:#7fd6a3"><i data-lucide=\'user-check\'></i> Mit Profil verknüpft — liegt im Konto dieser Person</span>':'<span class="muted">Noch kein Profil zu dieser E-Mail. Sobald sich die Person mit dieser E-Mail registriert, wird die Einreichung automatisch ihrem Konto zugeordnet.</span>'}</div></div>
    <div class="grid2">
      <div class="field"><label>Kategorie</label><div>${esc(s.category)}</div></div>
      <div class="field"><label>Betreff</label><div>${esc(s.subject||'—')}</div></div>
    </div>
    <div class="field"><label>Nachricht</label><div style="white-space:pre-wrap;background:rgba(255,255,255,.04);padding:.7rem;border-radius:6px">${esc(s.message||'—')}</div></div>
    <div class="field"><label>Datei</label><div>${fileLink}</div></div>
    <div class="field"><label>Status</label><select id="s_status">
      ${['neu','in_pruefung','beantwortet','archiviert'].map(x=>`<option ${s.status===x?'selected':''} value="${x}">${x}</option>`).join('')}
    </select></div>
  `, async () => {
    await api('/submissions/'+s.id,{method:'PUT',body:{status:val('s_status')}});
    toast('Status aktualisiert');
  }, 'Status speichern');
  // download link needs auth via header; since <a> can't send headers, provide fetch fallback
  setTimeout(() => {
    const a = document.querySelector('#modal a[href*="/files/"]');
    if (a) a.addEventListener('click', async ev => {
      ev.preventDefault();
      try {
        const res = await fetch(`${API}/files/${s.fileKey}`, { headers:{ Authorization:'Bearer '+token }});
        if(!res.ok) throw new Error('Download fehlgeschlagen');
        const blob = await res.blob(); const url = URL.createObjectURL(blob);
        const dl = document.createElement('a'); dl.href=url; dl.download=s.fileName||'datei'; dl.click();
        URL.revokeObjectURL(url);
      } catch(e){ toast(e.message,true); }
    });
  }, 0);
}

/* ---- Plugins ---- */
async function viewPlugins(){
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h2>Plugins</h2><p>Funktionen an- und ausschalten — wie ein App-Store für deine Website.</p></div></div>
    <div id="pluginList" class="muted">Lädt…</div>`;
  let list = [];
  try { list = await api('/admin/plugins'); } catch(e){ toast(e.message,true); }
  const host = document.getElementById('pluginList');
  host.classList.remove('muted');
  host.innerHTML = list.map(pluginCard).join('') || '<div class="empty">Keine Plugins.</div>';
  list.forEach(pl => {
    document.querySelector(`[data-plugin-save="${pl.id}"]`).addEventListener('click', () => savePlugin(pl));
    const tgl = document.querySelector(`[data-plugin-toggle="${pl.id}"]`);
    tgl.addEventListener('change', () => savePlugin(pl, tgl.checked));
    if (pl.id === 'newsletter') loadSubscribers();
  });
  lucide.createIcons();
}
function pluginField(pid, f, settings){
  const v = settings[f.key];
  const id = `pl_${pid}_${f.key}`;
  if (f.type === 'i18n') return `<div class="grid2">
    <div class="field"><label>${esc(f.label)} (DE)</label><input id="${id}_de" value="${esc((v||{}).de||'')}"></div>
    <div class="field"><label>${esc(f.label)} (EN)</label><input id="${id}_en" value="${esc((v||{}).en||'')}"></div></div>`;
  if (f.type === 'select') return `<div class="field"><label>${esc(f.label)}</label><select id="${id}">${f.options.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if (f.type === 'textarea') return `<div class="field"><label>${esc(f.label)}</label><textarea id="${id}">${esc(v||'')}</textarea></div>`;
  return `<div class="field"><label>${esc(f.label)}</label><input id="${id}" value="${esc(v||'')}"></div>`;
}
function pluginCard(pl){
  return `<div class="card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem">
      <div style="display:flex;gap:.9rem;align-items:flex-start">
        <div style="color:var(--gold);margin-top:.15rem"><i data-lucide="${esc(pl.icon)}"></i></div>
        <div><div style="font-weight:600;font-size:1rem">${esc(pl.name)}</div>
          <div class="muted" style="font-size:.8rem;margin-top:.15rem">${esc(pl.description)}</div></div>
      </div>
      <label style="display:flex;align-items:center;gap:.5rem;flex-shrink:0;text-transform:none;letter-spacing:0;color:var(--white);font-size:.78rem">
        <input type="checkbox" data-plugin-toggle="${pl.id}" ${pl.enabled?'checked':''} style="width:auto"> ${pl.enabled?'An':'Aus'}</label>
    </div>
    <div style="border-top:1px solid var(--line);padding-top:1rem">
      ${pl.fields.map(f=>pluginField(pl.id,f,pl.settings)).join('')}
      <button class="btn btn-gold btn-sm" data-plugin-save="${pl.id}"><i data-lucide="save"></i> Speichern</button>
    </div>
    ${pl.id==='newsletter'?`<div id="subsBox" style="border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem"><div class="muted" style="font-size:.8rem">Abonnenten lädt…</div></div>`:''}
  </div>`;
}
function readPluginSettings(pl){
  const s = {};
  pl.fields.forEach(f => {
    const id = `pl_${pl.id}_${f.key}`;
    if (f.type === 'i18n') s[f.key] = { de: val(id+'_de'), en: val(id+'_en') };
    else s[f.key] = val(id);
  });
  return s;
}
async function savePlugin(pl, enabledOverride){
  try {
    const body = { settings: readPluginSettings(pl) };
    const tgl = document.querySelector(`[data-plugin-toggle="${pl.id}"]`);
    body.enabled = (typeof enabledOverride === 'boolean') ? enabledOverride : (tgl ? tgl.checked : pl.enabled);
    await api('/plugins/'+pl.id, { method:'PUT', body });
    toast(`Plugin „${pl.name}" gespeichert`);
    viewPlugins();
  } catch(e){ toast(e.message, true); }
}
async function loadSubscribers(){
  const box = document.getElementById('subsBox'); if(!box) return;
  let subs = [];
  try { subs = await api('/plugins/newsletter/subscribers'); } catch(e){ box.innerHTML = '<span class="muted">—</span>'; return; }
  const conf = subs.filter(s=>s.status==='confirmed').length;
  box.innerHTML = `<div class="label" style="color:var(--gold);margin-bottom:.6rem">Abonnenten (${conf} bestätigt / ${subs.length} gesamt)</div>` +
    (subs.length ? subs.map(s=>{const ok=s.status==='confirmed';return `<div style="font-size:.82rem;padding:.25rem 0;display:flex;align-items:center;gap:.5rem"><span class="pill ${ok?'pill-pub':'pill-soon'}" style="font-size:.55rem">${ok?'bestätigt':'ausstehend'}</span> ${esc(s.email)} <span class="muted" style="font-size:.7rem">· ${new Date(s.createdAt).toLocaleDateString('de-DE')}</span></div>`;}).join('') : '<span class="muted" style="font-size:.8rem">Noch keine Anmeldungen.</span>');
}

/* ================= helpers: modal + rows ================= */
function val(id){ const e=document.getElementById(id); return e?e.value:''; }
function openModal(title, html, onSave, saveLabel){
  const m = document.getElementById('modal');
  m.innerHTML = `<h3>${esc(title)}</h3>${html}
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">Abbrechen</button>
      ${onSave?`<button class="btn btn-gold" id="modalSave"><i data-lucide="save"></i> ${esc(saveLabel||'Speichern')}</button>`:''}
    </div>`;
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  if (onSave) document.getElementById('modalSave').addEventListener('click', async () => {
    const sb = document.getElementById('modalSave');
    const orig = sb.innerHTML;
    sb.disabled = true; sb.innerHTML = '<i data-lucide="loader-2" class="spin"></i> Speichern…'; lucide.createIcons();
    try { await onSave(); closeModal(); await refreshAll(); rerender(); }
    catch(e){ sb.disabled = false; sb.innerHTML = orig; lucide.createIcons(); toast(e.message, true); }
  });
  lucide.createIcons();
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id==='modalBg') closeModal(); });

let currentView='dashboard';
const _show = show;
show = v => { currentView=v; _show(v); };
function rerender(){ _show(currentView); }

function bindRowActions(kind, list, editFn, delFn){
  document.querySelectorAll(`[data-edit="${kind}"]`).forEach(b =>
    b.addEventListener('click', () => editFn(list.find(x => x.id===b.dataset.id))));
  document.querySelectorAll(`[data-del="${kind}"]`).forEach(b =>
    b.addEventListener('click', async () => {
      if(!confirm('Wirklich löschen?')) return;
      try { await delFn(b.dataset.id); await refreshAll(); rerender(); } catch(e){ toast(e.message,true); }
    }));
}

/* ================= boot ================= */
(async function boot(){
  lucide.createIcons();
  if (token) {
    try { const r = await api('/auth/me'); if (r.user.role==='admin'){ me=r.user; return enterApp(); } } catch(e){}
    token=''; localStorage.removeItem('benleo_admin_token');
  }
})();
</script>
